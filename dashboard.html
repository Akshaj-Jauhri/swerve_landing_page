<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Poppins',sans-serif;color:#fafafa;
  background:radial-gradient(circle at 20% 30%,rgba(99,102,241,.15),transparent 40%),
             radial-gradient(circle at 80% 70%,rgba(59,130,246,.15),transparent 40%),#000;
  min-height:100vh;-webkit-font-smoothing:antialiased}
.card{background:rgba(24,24,27,.95);border:1px solid rgba(255,255,255,.08);border-radius:16px;overflow:hidden}
.gt-purple{background:linear-gradient(135deg,#9666e3,#1892f3);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.lbl{font-size:.72rem;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:rgba(150,102,227,.9)}
.inp{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:10px;color:#fafafa;width:100%;padding:10px 13px;font-size:.9rem;outline:none;font-family:'Poppins',sans-serif;transition:border-color .2s}
.inp:focus{border-color:rgba(150,102,227,.5)}
.inp::placeholder{color:rgba(255,255,255,.25)}
select.inp option{background:#18181b}
.drop{border:1px dashed rgba(150,102,227,.3);border-radius:10px;padding:1.6rem;text-align:center;cursor:pointer;transition:.2s}
.drop:hover{border-color:rgba(150,102,227,.6);background:rgba(150,102,227,.04)}
.dt{width:100%;border-collapse:collapse}
.dt th{font-size:.66rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.4);padding:10px 14px;border-bottom:1px solid rgba(255,255,255,.06);text-align:left;white-space:nowrap}
.dt td{padding:11px 14px;border-bottom:1px solid rgba(255,255,255,.04);font-size:.86rem}
.dt tbody tr:hover{background:rgba(255,255,255,.02)}
.gbtn{position:relative;border:none;border-radius:12px;cursor:pointer;color:#fff;font-family:'Poppins',sans-serif;font-weight:600;
  background:linear-gradient(135deg,#9666e3,#1892f3);padding:11px 22px;font-size:.9rem;transition:transform .15s,box-shadow .2s}
.gbtn:hover{transform:translateY(-1px);box-shadow:0 6px 24px rgba(150,102,227,.45)}
.gbtn:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}
.gbtn-ghost{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12)}
.tab{padding:8px 16px;border-radius:9px;cursor:pointer;font-size:.85rem;font-weight:500;border:1px solid transparent;color:rgba(255,255,255,.55);background:none}
.tab.on{background:rgba(150,102,227,.14);border-color:rgba(150,102,227,.3);color:#fff}
.kpi{background:rgba(255,255,255,.03);border-radius:12px;padding:1rem 1.1rem}
.kpi .k{font-size:.7rem;color:rgba(255,255,255,.45);text-transform:uppercase;letter-spacing:.08em}
.kpi .v{font-size:1.5rem;font-weight:600;margin-top:4px}
.pos{color:#4ade80}.neg{color:#f87171}
.x{background:none;border:none;color:rgba(255,255,255,.4);cursor:pointer;font-size:1.1rem;line-height:1}
::-webkit-scrollbar{width:5px;height:5px}::-webkit-scrollbar-thumb{background:#333}
@media(max-width:760px){
  /* results grid: holdings + currency stack instead of squishing */
  .rgrid{grid-template-columns:1fr!important;}
  /* keep wide tables scrollable rather than overflowing the card */
  .card{max-width:100%;overflow-x:hidden;}
  .dt-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;}
}
@media(max-width:420px){
  /* tighten outer padding on small phones */
  .page{padding-left:1rem!important;padding-right:1rem!important;}
  .kpi .v{font-size:1.3rem;}
}
/* ── Cross-page brand nav (calendar / home style) ── */
body{padding-top:56px}
#swerve-nav{position:fixed;top:0;left:0;right:0;z-index:1500;background:transparent;border-bottom:1px solid transparent;transition:all .3s ease}
#swerve-nav.scrolled{background:rgba(0,0,0,.92);backdrop-filter:blur(16px);border-bottom:1px solid rgba(255,255,255,.06)}
#swerve-nav .navwrap{max-width:1280px;margin:0 auto;padding:1rem 2rem;display:flex;align-items:center;justify-content:space-between}
#swerve-nav .brand{display:block;line-height:0}
#swerve-nav .links{display:flex;align-items:center;gap:28px}
#swerve-nav .links a{font-size:.84rem;font-weight:500;color:rgba(255,255,255,.5);letter-spacing:-.01em;transition:color .2s;text-decoration:none}
#swerve-nav .links a:hover,#swerve-nav .links a.active{color:#fff}
#swerve-nav .loginbtn{padding:9px 20px;font-size:.82rem;font-weight:600;color:#fff;border-radius:10px;background:linear-gradient(135deg,#9666e3,#1892f3);text-decoration:none}
#swerve-nav .menu-toggle{display:none;background:none;border:none;color:#fff;font-size:1.4rem;cursor:pointer}
#swerve-nav .mobile{display:none;background:rgba(0,0,0,.95);border-top:1px solid rgba(255,255,255,.06);padding:.75rem 2rem 1.25rem;flex-direction:column;gap:4px}
#swerve-nav .mobile a{color:rgba(255,255,255,.8);font-weight:500;padding:10px 0;font-size:.9rem;border-bottom:1px solid rgba(255,255,255,.05);text-decoration:none}
@media(max-width:860px){#swerve-nav .links{display:none}#swerve-nav .menu-toggle{display:block}#swerve-nav .mobile.open{display:flex}}
</style>

  ["Nikkei 225","^N225"],["Hang Seng","^HSI"]];
const pct = v => (v==null?"—":(v>=0?"+":"")+(v*100).toFixed(2)+"%");
const pp  = v => (v==null?"—":(v>=0?"+":"")+v.toFixed(2)+"%");
const num = (v,d=2)=> v==null?"—":Number(v).toLocaleString(undefined,{maximumFractionDigits:d});

function emptyRow(){return {ticker:"",quantity:"",weight:"",purchase_price:"",name:"",currency:"",last_price:null,ok:null};}

function App(){
  const [model,setModel]=useState("quantity");
  const [tab,setTab]=useState("manual");
  const [rows,setRows]=useState([emptyRow(),emptyRow(),emptyRow()]);
  const [cfg,setCfg]=useState({base_currency:"USD",benchmark:"SPY",start_date:"2026-01-02",end_date:"",
    initial_capital:100000,fee_annual:0,rf_annual:3,return_basis:"total",weighting_mode:"buy_hold",schedule_rebalance:"daily"});
  const [busy,setBusy]=useState(false);
  const [msg,setMsg]=useState(null);
  const [res,setRes]=useState(null);
  const [lastReq,setLastReq]=useState(null);
  const [schedule,setSchedule]=useState(null);   // time-varying weights {date:{ticker:w}}
  const [schedDate,setSchedDate]=useState(new Date().toISOString().slice(0,10));
  const [dragOver,setDragOver]=useState(false);
  const [bmCustom,setBmCustom]=useState(false);

  const setRow=(i,k,v)=>setRows(r=>r.map((x,j)=>j===i?{...x,[k]:v}:x));
  const saveWeightsAsOf=(d)=>{
    const f=rows.filter(r=>r.ticker.trim());
    if(!f.length||!d){setMsg({t:"err",m:"Add at least one ticker and pick a date first."});return;}
    const col={}; f.forEach(r=>{col[r.ticker.trim()]=parseFloat(r.weight)||0;});
    setSchedule(s=>({...(s||{}),[d]:col})); setModel("weight");
    setMsg({t:"ok",m:`Saved these weights to the schedule as of ${d}.`});
  };
  const loadScheduleDate=(d)=>{
    if(!schedule||!schedule[d])return;
    const col=schedule[d];
    setRows(Object.keys(col).map(t=>({...emptyRow(),ticker:t,weight:col[t]})));
    setModel("weight"); setSchedDate(d);
    setMsg({t:"ok",m:`Editing weights as of ${d} — change them and re-save to update.`});
  };
  const deleteScheduleDate=(d)=>setSchedule(s=>{ if(!s)return s; const n={...s}; delete n[d];
    return Object.keys(n).length?n:null; });
  const addRow=()=>setRows(r=>[...r,emptyRow()]);
  const delRow=i=>setRows(r=>r.filter((_,j)=>j!==i));
  const filled=()=>rows.filter(r=>r.ticker.trim());
  const wtTotal=()=>rows.reduce((s,r)=>s+(r.ticker.trim()?(parseFloat(r.weight)||0):0),0);
  const equalize=()=>{const f=rows.filter(r=>r.ticker.trim());if(!f.length)return;
    const w=(100/f.length).toFixed(2);setRows(rs=>rs.map(r=>r.ticker.trim()?{...r,weight:w}:r));};
  const normalize=()=>{const t=wtTotal();if(t<=0)return;
    setRows(rs=>rs.map(r=>r.ticker.trim()?{...r,weight:((parseFloat(r.weight)||0)/t*100).toFixed(2)}:r));};
  // ── schedule-matrix editing (all dates shown as columns) ──
  const scheduleActive=()=>model==="weight" && schedule && Object.keys(schedule).length>0;
  const setSchedCell=(d,t,v)=>{t=t.trim();if(!t)return;setSchedule(s=>({...s,[d]:{...s[d],[t]:parseFloat(v)||0}}));};
  const renameSchedTicker=(oldT,newT)=>{newT=newT.trim();if(oldT===newT)return;
    setSchedule(s=>{const n={};for(const d in s){n[d]={};for(const k in s[d])if(k)n[d][k===oldT?newT:k]=s[d][k];}return n;});};
  const removeSchedTicker=t=>setSchedule(s=>{const n={};for(const d in s){n[d]={...s[d]};delete n[d][t];}return n;});
  const addSchedColumn=d=>{if(!d)return;setSchedule(s=>{const dates=Object.keys(s||{}).sort();
    const src=dates.length?s[dates[dates.length-1]]:Object.fromEntries(rows.filter(r=>r.ticker.trim()).map(r=>[r.ticker.trim(),parseFloat(r.weight)||0]));
    return {...(s||{}),[d]:{...src}};});setModel("weight");setMsg({t:"ok",m:`Added rebalance date ${d}.`});};

  const [user,setUser]=useState(null);
  const [authOpen,setAuthOpen]=useState(false);
  const [myOpen,setMyOpen]=useState(false);
  useEffect(()=>{
    sb.auth.getSession().then(({data})=>setUser(data.session?data.session.user:null));
    const {data:s}=sb.auth.onAuthStateChange((_e,sess)=>setUser(sess?sess.user:null));
    return ()=>s.subscription.unsubscribe();
  },[]);

  async function savePortfolio(){
    if(!user){setAuthOpen(true);return;}
    const f=filled(); if(!f.length){setMsg({t:"err",m:"Add holdings first."});return;}
    const name=prompt("Name this portfolio:", (cfg.benchmark||"My")+" portfolio");
    if(!name)return;
    const holdings=f.map(r=>{const h={ticker:r.ticker.trim(),name:r.name||null};
      if(model==="quantity"){h.quantity=parseFloat(r.quantity)||0;if(r.purchase_price)h.purchase_price=parseFloat(r.purchase_price);}
      else h.weight=parseFloat(r.weight)||0; return h;});
    const rec={user_id:user.id,name,model,base_currency:cfg.base_currency,benchmark:cfg.benchmark,
      start_date:cfg.start_date||null,end_date:cfg.end_date||null,initial_capital:parseFloat(cfg.initial_capital)||null,
      fee_annual:parseFloat(cfg.fee_annual)||0,return_basis:cfg.return_basis,weighting_mode:cfg.weighting_mode,holdings,
      schedule:schedule||null};
    const {error}=await sb.from("portfolios").insert(rec);
    setMsg(error?{t:"err",m:"Save failed: "+error.message}:{t:"ok",m:'Saved "'+name+'".'});
  }
  function loadPortfolio(p){
    setModel(p.model);
    setCfg(c=>({...c,base_currency:p.base_currency,benchmark:p.benchmark,start_date:p.start_date||c.start_date,
      end_date:p.end_date||"",initial_capital:p.initial_capital||c.initial_capital,fee_annual:p.fee_annual||0,
      return_basis:p.return_basis||"total",weighting_mode:p.weighting_mode||"buy_hold"}));
    setRows((p.holdings||[]).map(h=>({...emptyRow(),ticker:h.ticker||"",quantity:h.quantity!=null?h.quantity:"",
      weight:h.weight!=null?h.weight:"",purchase_price:h.purchase_price!=null?h.purchase_price:"",name:h.name||""})));
    setSchedule(p.schedule||null);
    setMyOpen(false); setTab("manual"); setRes(null);
    setMsg({t:"ok",m:'Loaded "'+p.name+'"'+(p.schedule?" (with weight schedule)":"")+" — hit Compute NAV."});
  }

  function parseFile(file){
    const fmtDate=v=>{ const pad=n=>String(n).padStart(2,"0");
      // SheetJS emits date cells at ~23:59:50 of the PREVIOUS day (its UTC/local
      // rounding quirk). Shift +12h before reading local parts so the calendar
      // day snaps back to the intended date (fixes the IST off-by-one).
      const fromLocal=d=>{const s=new Date(d.getTime()+12*3600*1000);
        return `${s.getFullYear()}-${pad(s.getMonth()+1)}-${pad(s.getDate())}`;};
      if(v instanceof Date) return fromLocal(v);
      const s=String(v).trim();
      const iso=s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/);
      if(iso) return `${iso[1]}-${pad(iso[2])}-${pad(iso[3])}`;
      const d=new Date(s); return isNaN(d.getTime())?s:fromLocal(d); };
    const isDate=h=>h instanceof Date || /\d{4}[.\/-]\d{1,2}[.\/-]\d{1,2}|\d{1,2}[.\/-]\d{1,2}[.\/-]\d{2,4}/.test(String(h));

    // Auto-convert Bloomberg-style tickers (ROOT:CC) to Yahoo format via the
    // backend /convert lookup. Rewrites the grid + schedule; unconvertible ones
    // are kept and flagged by name so the user can fix them manually.
    const applyUpload=async(newRows,newSched,nameMap,baseMsg)=>{
      const hasBBG=newRows.some(r=>String(r.ticker).includes(":"));
      setSchedule(newSched||null); setRows(newRows); setTab("manual");
      if(baseMsg)setMsg(baseMsg);
      if(!hasBBG)return;
      setBusy(true);
      try{
        const items=newRows.filter(r=>String(r.ticker).includes(":"))
          .map(r=>({ticker:r.ticker.trim(),name:(nameMap&&nameMap[r.ticker.trim()])||r.name||null}));
        const resp=await fetch(API+"/convert",{method:"POST",headers:{"Content-Type":"application/json"},
          body:JSON.stringify({items})});
        const j=await resp.json(); const map={}; (j.results||[]).forEach(x=>map[x.input]=x);
        const remap={}, failed=[];
        const outRows=newRows.map(r=>{const t=r.ticker.trim(); const c=map[t]; if(!c)return r;
          if(c.ok){remap[t]=c.yahoo; return {...r,ticker:c.yahoo,name:c.name||r.name,ok:undefined,last_price:undefined};}
          failed.push({t,name:c.name}); return {...r,ok:false};});
        let outSched=null;
        if(newSched){outSched={};Object.keys(newSched).forEach(d=>{outSched[d]={};
          Object.keys(newSched[d]).forEach(tk=>{outSched[d][remap[tk]||tk]=newSched[d][tk];});});}
        setSchedule(outSched); setRows(outRows);
        const nconv=Object.keys(remap).length;
        setMsg(failed.length
          ? {t:"err",m:`Converted ${nconv} Bloomberg ticker(s) to Yahoo format. Couldn't convert: `+
              failed.map(f=>f.name?`${f.t} (${f.name})`:f.t).join(", ")+`. Enter their Yahoo tickers manually.`}
          : {t:"ok",m:`Converted ${nconv} Bloomberg ticker(s) to Yahoo format.`});
      }catch(e){
        setMsg({t:"err",m:"Bloomberg conversion service didn't respond — tickers left as-is. Try again in a moment."});
      }finally{setBusy(false);}
    };

    const handleAOA=(aoa)=>{
      aoa=(aoa||[]).filter(r=>r && r.some(c=>c!==null && c!==""));
      if(!aoa.length){setMsg({t:"err",m:"That file looks empty."});return;}
      const header=aoa[0];
      const dateCols=header.slice(1).filter(isDate);
      if(dateCols.length>=1){
        // ── weight schedule (col A = ticker, cols B+ = dates). One date column is
        //    treated as a single-date schedule so weight uploads always carry a date. ──
        const dates=header.slice(1).map(fmtDate);
        const body=aoa.slice(1).filter(r=>r[0]!=null && String(r[0]).trim());
        const tickers=body.map(r=>String(r[0]).trim());
        const sched={};
        dates.forEach((d,i)=>{ sched[d]={}; body.forEach(r=>{ sched[d][String(r[0]).trim()]=parseFloat(r[i+1])||0; }); });
        setModel("weight");
        const last=dates[dates.length-1];
        const firstDate=[...dates].sort()[0];             // earliest schedule date
        setCfg(c=>({...c,start_date:firstDate}));         // auto-set start to first upload date
        const rowsArr=tickers.map(t=>({...emptyRow(),ticker:t,weight:sched[last][t]}));
        applyUpload(rowsArr, sched, null, {t:"ok",m: dates.length>1
          ? `Loaded a weight schedule — ${tickers.length} tickers × ${dates.length} dates (${dates[0]} → ${last}). Start date set to ${firstDate}.`
          : `Loaded ${tickers.length} weights as of ${last}. Start date set to ${firstDate}.`});
        return;
      }
      // ── single weight/quantity column ──
      const norm=k=>String(k).toLowerCase().replace(/[^a-z]/g,"");
      const objs=aoa.slice(1).map(r=>{const o={};header.forEach((h,i)=>o[String(h)]=r[i]);return o;});
      const pick=(o,...keys)=>{for(const kk of Object.keys(o)){const n=norm(kk);if(keys.some(t=>n.includes(t)))return o[kk];}return "";};
      const out=objs.map(o=>({...emptyRow(),
        ticker:String(pick(o,"ticker","symbol")||"").trim(),
        name:String(pick(o,"name","company","security")||"").trim(),
        quantity:pick(o,"quantity","shares","qty")||"",
        weight:pick(o,"weight")||"",
        purchase_price:pick(o,"purchaseprice","costprice","avgprice","price")||""}));
      const good=out.filter(r=>r.ticker);
      if(!good.length){setMsg({t:"err",m:"Couldn't find a Ticker column in that file."});return;}
      const hasW=good.some(r=>r.weight!=="" && r.weight!=null);
      const hasQ=good.some(r=>r.quantity!=="" && r.quantity!=null);
      let picked=model;
      if(hasW && !hasQ){picked="weight";setModel("weight");}
      else if(hasQ){picked="quantity";setModel("quantity");}
      const nameMap={}; good.forEach(r=>{if(r.name)nameMap[r.ticker.trim()]=r.name;});
      applyUpload(good, null, nameMap,
        {t:"ok",m:`Loaded ${good.length} rows into ${picked==="weight"?"Target weights":"Shares held"} — review, then Compute.`});
    };
    const name=file.name.toLowerCase();
    if(name.endsWith(".csv")){Papa.parse(file,{header:false,skipEmptyLines:true,complete:r=>handleAOA(r.data)});}
    else{const rd=new FileReader();rd.onload=e=>{const wb=XLSX.read(e.target.result,{type:"array",cellDates:true});
      handleAOA(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1}));};rd.readAsArrayBuffer(file);}
  }
  function parsePaste(text){
    const out=text.split(/\n/).map(l=>l.trim()).filter(Boolean).map(l=>{const p=l.split(/[,\t]+/);
      const q=(p[1]||"").trim();
      return {...emptyRow(),ticker:(p[0]||"").trim(),quantity:q,weight:q};}).filter(r=>r.ticker);
    if(out.length){setSchedule(null);setRows(out);setTab("manual");setMsg({t:"ok",m:`Parsed ${out.length} tickers.`});}
  }

  async function resolve(){
    const f=filled();if(!f.length){setMsg({t:"err",m:"Add at least one ticker."});return;}
    setBusy(true);setMsg(null);
    try{
      const r=await fetch(API+"/resolve",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({tickers:f.map(x=>x.ticker.trim())})});
      const j=await r.json();const map={};j.results.forEach(x=>map[x.ticker.toUpperCase()]=x);
      setRows(rs=>rs.map(x=>{const m=map[x.ticker.trim().toUpperCase()];
        return m?{...x,ok:m.ok,name:m.name||x.name,currency:m.currency||"",last_price:m.last_price}:x;}));
      const bad=j.results.filter(x=>!x.ok);
      setMsg(bad.length?{t:"err",m:`Unresolved: ${bad.map(b=>b.ticker).join(", ")}`}:{t:"ok",m:"All tickers resolved."});
    }catch(e){setMsg({t:"err",m:"Resolve failed — the pricing service didn't respond. Please try again in a moment."});}
    setBusy(false);
  }

  async function compute(){
    const f=filled();if(!f.length){setMsg({t:"err",m:"Add at least one holding."});return;}
    setBusy(true);setMsg(null);setRes(null);
    const holdings=f.map(r=>{const h={ticker:r.ticker.trim(),name:r.name||undefined};
      if(model==="quantity"){h.quantity=parseFloat(r.quantity)||0;if(r.purchase_price)h.purchase_price=parseFloat(r.purchase_price);}
      else{h.weight=parseFloat(r.weight)||0;}return h;});
    const body={...cfg,model,end_date:cfg.end_date||null,
      initial_capital:parseFloat(cfg.initial_capital)||100000,fee_annual:parseFloat(cfg.fee_annual)||0,
      rf_annual:parseFloat(cfg.rf_annual)||0,holdings};
    if(schedule){body.model="weight";body.schedule=schedule;}   // time-varying weights override
    setLastReq(body);
    try{
      const r=await fetch(API+"/compute",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
      const j=await r.json();
      if(!r.ok){setMsg({t:"err",m:j.detail||"Compute failed."});setBusy(false);return;}
      setRes(j);
      if(j.warnings&&j.warnings.length)setMsg({t:"err",m:j.warnings.join(" · ")});
    }catch(e){setMsg({t:"err",m:"Compute failed — the pricing service didn't respond. Please try again in a moment."});}
    setBusy(false);
  }

  return (
    <div className="page" style={{maxWidth:1180,margin:"0 auto",padding:"3rem 1.5rem 5rem",color:"#fafafa"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:10,marginBottom:".5rem",flexWrap:"wrap"}}>
        <div className="lbl">Swerve · Portfolio Analytics</div>
        <div style={{display:"flex",gap:8,alignItems:"center"}}>
          {user ? <React.Fragment>
            <button className="gbtn gbtn-ghost" style={{fontSize:".78rem",padding:"7px 13px"}} onClick={()=>setMyOpen(true)}>My portfolios</button>
            <span style={{fontSize:".76rem",color:"rgba(255,255,255,.5)"}}>{user.email}</span>
            <button className="gbtn gbtn-ghost" style={{fontSize:".78rem",padding:"7px 13px"}} onClick={()=>sb.auth.signOut()}>Log out</button>
          </React.Fragment> :
          <button className="gbtn gbtn-ghost" style={{fontSize:".78rem",padding:"7px 13px"}} onClick={()=>setAuthOpen(true)}>Sign in</button>}
        </div>
      </div>
      <h1 style={{fontSize:"2.4rem",fontWeight:800,letterSpacing:"-.03em",margin:".4rem 0 .3rem"}}>
        <span className="gt-purple">NAV Dashboard</span></h1>
      <p style={{color:"rgba(255,255,255,.55)",fontSize:".95rem",marginBottom:"2rem"}}>
        Upload or enter a portfolio, track its NAV, and compare it to a benchmark of your choice.</p>

      <div className="card" style={{padding:"1.5rem",marginBottom:"1.5rem"}}>
        <div style={{display:"flex",gap:8,marginBottom:"1.2rem",flexWrap:"wrap"}}>
          <div style={{display:"flex",gap:6,background:"rgba(255,255,255,.04)",padding:4,borderRadius:11}}>
            {["quantity","weight"].map(m=>(
              <button key={m} className={"tab"+(model===m?" on":"")} onClick={()=>setModel(m)}>
                {m==="quantity"?"Shares held":"Target weights"}</button>))}
          </div>
          <div style={{flex:1}}></div>
          <div style={{display:"flex",gap:6}}>
            {[["manual","Manual"],["upload","Upload"],["paste","Paste"]].map(([k,l])=>(
              <button key={k} className={"tab"+(tab===k?" on":"")} onClick={()=>setTab(k)}>{l}</button>))}
          </div>
        </div>

        {schedule && (
          <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:"1rem",padding:"9px 13px",borderRadius:10,
            background:"rgba(150,102,227,.1)",border:"1px solid rgba(150,102,227,.3)",fontSize:".84rem"}}>
            <span>📅 <b>Weight schedule loaded</b> — {Object.keys(schedule).length} {Object.keys(schedule).length===1?"date":"dates"}. Set drift vs daily-rebalance in the <b>Between dates</b> control. Edit any weight below or add a date.</span>
            <div style={{flex:1}}></div>
            <button className="x" title="Clear schedule" onClick={()=>{setSchedule(null);setMsg({t:"ok",m:"Schedule cleared — now using the weights in the grid."});}}>×</button>
          </div>)}

        {tab==="upload" && (
          <label className="drop" style={{display:"block",...(dragOver?{borderColor:"rgba(150,102,227,.8)",background:"rgba(150,102,227,.08)"}:{})}}
            onDragOver={e=>{e.preventDefault();setDragOver(true);}}
            onDragLeave={e=>{e.preventDefault();setDragOver(false);}}
            onDrop={e=>{e.preventDefault();setDragOver(false);
              const f=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0];
              if(f)parseFile(f); else setMsg({t:"err",m:"Couldn't read the dropped file."});}}>
            <input type="file" accept=".csv,.xlsx,.xls" style={{display:"none"}}
              onChange={e=>e.target.files[0]&&parseFile(e.target.files[0])}/>
            <div style={{fontSize:"1.6rem",marginBottom:6}}>📄</div>
            <div style={{fontWeight:500}}>Drop a CSV or Excel, or click to browse</div>
            <div style={{color:"rgba(255,255,255,.4)",fontSize:".8rem",marginTop:5}}>
              Columns: Ticker, {model==="quantity"?"Quantity, [Purchase price]":"Weight"}</div>
          </label>)}
        {tab==="upload" && (
          <div style={{fontSize:".8rem",color:"rgba(255,255,255,.5)",marginTop:8,textAlign:"center"}}>
            Not sure of the format? <a href={API+"/template"} target="_blank" rel="noopener"
              style={{color:"#9666e3",fontWeight:500}}>Download the sample template</a> — it shows every accepted layout (dated weights, simple weights, quantities).
          </div>)}
        {tab==="paste" && (
          <textarea className="inp" rows="5" placeholder={"AAPL, 20\nMSFT, 10\n9988.HK, 15"}
            style={{fontFamily:"monospace"}} onBlur={e=>parsePaste(e.target.value)}/>)}

        {tab==="manual" && scheduleActive() && (
          <div style={{overflowX:"auto"}}>
            <table className="dt">
              <thead><tr>
                <th>Ticker</th>
                {Object.keys(schedule).sort().map(d=>(
                  <th key={d} style={{whiteSpace:"nowrap"}}>{d} <span style={{cursor:"pointer",color:"rgba(255,255,255,.4)"}}
                    title="Remove this date" onClick={()=>deleteScheduleDate(d)}>×</span></th>))}
                <th>Resolved</th><th></th></tr></thead>
              <tbody>
                {rows.map((r,i)=>(
                  <tr key={i}>
                    <td><input className="inp" style={{width:120}} defaultValue={r.ticker} key={"tk"+i+"-"+r.ticker} placeholder="AAPL"
                      onBlur={e=>{const nv=e.target.value.trim();if(nv!==r.ticker){renameSchedTicker(r.ticker,nv);setRow(i,"ticker",nv);}}}/></td>
                    {Object.keys(schedule).sort().map(d=>(
                      <td key={d}><input className="inp" style={{width:78}} type="number" value={schedule[d][r.ticker.trim()]??""}
                        onChange={e=>setSchedCell(d,r.ticker,e.target.value)}/></td>))}
                    <td style={{color:r.ok===false?"#f87171":r.ok?"#4ade80":"rgba(255,255,255,.4)",fontSize:".8rem"}}>
                      {r.ok===false?"not found":r.ok?`${r.name} · ${r.currency} · ${SYM[r.currency]||""}${num(r.last_price)}`:"—"}</td>
                    <td><button className="x" onClick={()=>{removeSchedTicker(r.ticker.trim());delRow(i);}}>×</button></td>
                  </tr>))}
                <tr style={{borderTop:"1px solid rgba(255,255,255,.12)"}}>
                  <td style={{fontSize:".76rem",color:"rgba(255,255,255,.45)"}}>Total %</td>
                  {Object.keys(schedule).sort().map(d=>{const tot=Object.values(schedule[d]).reduce((a,b)=>a+(parseFloat(b)||0),0);
                    return <td key={d} style={{fontSize:".78rem",fontWeight:600,color:Math.abs(tot-100)<0.5?"#4ade80":"rgba(255,255,255,.5)"}}>{tot.toFixed(1)}</td>;})}
                  <td></td><td></td></tr>
              </tbody>
            </table>
            <div style={{display:"flex",gap:10,marginTop:12,alignItems:"center",flexWrap:"wrap"}}>
              <button className="gbtn gbtn-ghost" style={{fontSize:".82rem",padding:"8px 16px"}} onClick={addRow}>+ Add ticker</button>
              <span style={{fontSize:".82rem",color:"rgba(255,255,255,.55)",marginLeft:8}}>Add a rebalance date:</span>
              <input className="inp" type="date" style={{width:150}} value={schedDate} onChange={e=>setSchedDate(e.target.value)}/>
              <button className="gbtn gbtn-ghost" style={{fontSize:".82rem",padding:"8px 16px"}} onClick={()=>addSchedColumn(schedDate)}>+ Add date</button>
              <button className="gbtn gbtn-ghost" style={{fontSize:".82rem",padding:"8px 16px",marginLeft:"auto"}}
                onClick={()=>{setSchedule(null);setMsg({t:"ok",m:"Schedule cleared — back to fixed weights."});}}>Clear schedule</button>
            </div>
            <div style={{fontSize:".76rem",color:"rgba(255,255,255,.4)",marginTop:8}}>
              Each dated column holds the target weights that take effect from that date. Edit any cell directly; “+ Add date” starts from the latest column’s weights.
            </div>
          </div>)}

        {tab==="manual" && !scheduleActive() && (
          <div style={{overflowX:"auto"}}>
            <table className="dt">
              <thead><tr>
                <th>Ticker</th>{model==="quantity"?<th>Shares</th>:<th>Weight %</th>}
                {model==="quantity"&&<th>Purchase price</th>}<th>Resolved</th><th></th></tr></thead>
              <tbody>
                {rows.map((r,i)=>(
                  <tr key={i}>
                    <td><input className="inp" style={{width:120}} value={r.ticker} placeholder="AAPL"
                      onChange={e=>setRow(i,"ticker",e.target.value)}/></td>
                    {model==="quantity"
                      ? <td><input className="inp" style={{width:100}} value={r.quantity} type="number"
                          onChange={e=>setRow(i,"quantity",e.target.value)}/></td>
                      : <td><input className="inp" style={{width:100}} value={r.weight} type="number"
                          onChange={e=>setRow(i,"weight",e.target.value)}/></td>}
                    {model==="quantity"&&<td><input className="inp" style={{width:120}} value={r.purchase_price} type="number"
                      placeholder="optional" onChange={e=>setRow(i,"purchase_price",e.target.value)}/></td>}
                    <td style={{color:r.ok===false?"#f87171":r.ok?"#4ade80":"rgba(255,255,255,.4)",fontSize:".8rem"}}>
                      {r.ok===false?"not found":r.ok?`${r.name} · ${r.currency} · ${SYM[r.currency]||""}${num(r.last_price)}`:"—"}</td>
                    <td><button className="x" onClick={()=>delRow(i)}>×</button></td>
                  </tr>))}
              </tbody>
            </table>
            <div style={{display:"flex",gap:10,marginTop:12,alignItems:"center",flexWrap:"wrap"}}>
              <button className="gbtn gbtn-ghost" style={{fontSize:".82rem",padding:"8px 16px"}} onClick={addRow}>+ Add row</button>
              {model==="weight" && <React.Fragment>
                <button className="gbtn gbtn-ghost" style={{fontSize:".82rem",padding:"8px 16px"}} onClick={equalize}>Equal weight</button>
                <button className="gbtn gbtn-ghost" style={{fontSize:".82rem",padding:"8px 16px"}} onClick={normalize}>Normalize to 100%</button>
                <span style={{fontSize:".82rem",marginLeft:"auto",
                  color:Math.abs(wtTotal()-100)<0.5?"#4ade80":"rgba(255,255,255,.5)"}}>
                  Total weight: <b>{wtTotal().toFixed(1)}%</b></span>
              </React.Fragment>}
            </div>
            {model==="weight" && (
              <div style={{marginTop:14,paddingTop:14,borderTop:"1px solid rgba(255,255,255,.06)"}}>
                <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
                  <span style={{fontSize:".82rem",color:"rgba(255,255,255,.55)"}}>Weights change over time?</span>
                  <input className="inp" type="date" style={{width:155}} value={schedDate} onChange={e=>setSchedDate(e.target.value)}/>
                  <button className="gbtn gbtn-ghost" style={{fontSize:".82rem",padding:"8px 16px"}}
                    onClick={()=>saveWeightsAsOf(schedDate)}>Start a dated schedule</button>
                  <span style={{fontSize:".76rem",color:"rgba(255,255,255,.4)"}}>
                    Saves the current weights under this date. You can then add more dates and edit each — the NAV rebalances across them.</span>
                </div>
              </div>)}
          </div>)}
      </div>

      <div className="card" style={{padding:"1.5rem",marginBottom:"1.5rem"}}>
        <div className="lbl" style={{marginBottom:"1rem"}}>Settings</div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(150px,1fr))",gap:14}}>
          <Field label="Currency"><select className="inp" value={cfg.base_currency}
            onChange={e=>setCfg({...cfg,base_currency:e.target.value})}>{CCYS.map(c=><option key={c}>{c}</option>)}</select></Field>
          <Field label="Benchmark"><select className="inp"
            value={(bmCustom||!BM.some(([l,t])=>t===cfg.benchmark))?"__custom__":cfg.benchmark}
            onChange={e=>{const v=e.target.value;
              if(v==="__custom__"){setBmCustom(true);setCfg({...cfg,benchmark:""});}
              else{setBmCustom(false);setCfg({...cfg,benchmark:v});}}}>
            {BM.map(([l,t])=><option key={t} value={t} style={{background:"#1a1a1a",color:"#fafafa"}}>{l} ({t})</option>)}
            <option value="__custom__" style={{background:"#1a1a1a",color:"#fafafa"}}>Custom ticker…</option>
          </select>
          {(bmCustom||!BM.some(([l,t])=>t===cfg.benchmark)) &&
            <input className="inp" style={{marginTop:8}} placeholder="Yahoo ticker, e.g. ^GSPC, VOO, 000300.SS"
              value={cfg.benchmark} onChange={e=>setCfg({...cfg,benchmark:e.target.value})}/>}
          <div style={{fontSize:".72rem",color:"rgba(255,255,255,.4)",marginTop:6,lineHeight:1.5}}>
            This is your <b style={{color:"rgba(255,255,255,.65)"}}>base benchmark</b> — used for Alpha, Beta, Tracking error and all vs-benchmark stats. You can add more benchmarks to the chart afterwards for visual comparison only.</div></Field>
          <Field label="Start date"><input className="inp" type="date" value={cfg.start_date}
            onChange={e=>setCfg({...cfg,start_date:e.target.value})}/></Field>
          <Field label="End date"><input className="inp" type="date" value={cfg.end_date}
            onChange={e=>setCfg({...cfg,end_date:e.target.value})}/></Field>
          {model==="weight"&&<Field label="Capital"><input className="inp" type="number" value={cfg.initial_capital}
            onChange={e=>setCfg({...cfg,initial_capital:e.target.value})}/></Field>}
          <Field label="Fee % / yr"><input className="inp" type="number" step="0.1" value={cfg.fee_annual}
            onChange={e=>setCfg({...cfg,fee_annual:e.target.value})}/></Field>
          <Field label="Risk-free % / yr"><input className="inp" type="number" step="0.1" value={cfg.rf_annual}
            onChange={e=>setCfg({...cfg,rf_annual:e.target.value})}/></Field>
          <Field label="Return basis"><select className="inp" value={cfg.return_basis}
            onChange={e=>setCfg({...cfg,return_basis:e.target.value})}>
            <option value="total">Total (div-adj)</option><option value="price">Price</option></select></Field>
          {model==="weight"&&(()=>{
            // One context-aware toggle. "hold" = don't trade between weight changes
            // (buy&hold when fixed / drift when scheduled); "daily" = hold target by
            // trading daily. Both cfg fields are kept in sync so the backend picks
            // the right one whether or not a schedule is present.
            const sched=scheduleActive();
            const val=sched?(cfg.schedule_rebalance==="daily"?"daily":"hold")
                           :(cfg.weighting_mode==="rebalance"?"daily":"hold");
            return <Field label={sched?"Between dates":"Weighting"}>
              <select className="inp" value={val}
                onChange={e=>{const hold=e.target.value==="hold";
                  setCfg({...cfg,weighting_mode:hold?"buy_hold":"rebalance",
                                 schedule_rebalance:hold?"periodic":"daily"});}}
                title="Hold: no trading between weight changes (drift). Daily: hold target weights by trading daily.">
                <option value="hold">{sched?"Drift (hold between dates)":"Buy & hold"}</option>
                <option value="daily">{sched?"Rebalance daily":"Daily rebalance"}</option>
              </select></Field>;
          })()}
        </div>
        <div style={{display:"flex",gap:10,marginTop:"1.4rem",alignItems:"center",flexWrap:"wrap"}}>
          <button className="gbtn gbtn-ghost" onClick={resolve} disabled={busy}>Resolve tickers</button>
          <button className="gbtn" onClick={compute} disabled={busy}>{busy?"Computing…":"Compute NAV"}</button>
          <button className="gbtn gbtn-ghost" onClick={savePortfolio} disabled={busy} title={user?"Save to your account":"Sign in to save"}>Save</button>
          {msg&&<span style={{fontSize:".84rem",color:msg.t==="err"?"#f87171":"#4ade80"}}>{msg.m}</span>}
        </div>
      </div>

      {res && <Results res={res} cfg={cfg} model={model} lastReq={lastReq}/>}
      {authOpen && <AuthModal onClose={()=>setAuthOpen(false)}/>}
      {myOpen && <MyPortfolios onClose={()=>setMyOpen(false)} onLoad={loadPortfolio}/>}
    </div>
  );
}

function Overlay({children,onClose}){
  return (
    <div onClick={onClose} style={{position:"fixed",inset:0,background:"rgba(0,0,0,.6)",
      backdropFilter:"blur(4px)",zIndex:1000,display:"flex",alignItems:"center",justifyContent:"center",padding:"1rem"}}>
      <div onClick={e=>e.stopPropagation()} className="card"
        style={{width:"100%",maxWidth:420,padding:"1.75rem",background:"#141417"}}>{children}</div>
    </div>);
}

function AuthModal({onClose}){
  const [mode,setMode]=useState("in");
  const [email,setEmail]=useState(""),[pw,setPw]=useState("");
  const [st,setSt]=useState(null);
  async function go(){
    if(!email||!pw){setSt({t:"err",m:"Enter email and password."});return;}
    setSt({t:"busy",m:"…"});
    const {error}= mode==="in"
      ? await sb.auth.signInWithPassword({email,password:pw})
      : await sb.auth.signUp({email,password:pw});
    if(error)setSt({t:"err",m:error.message});
    else if(mode==="up")setSt({t:"ok",m:"Account created. Check your email to confirm, then sign in."});
    else onClose();
  }
  return (
    <Overlay onClose={onClose}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"1.2rem"}}>
        <div style={{fontSize:"1.15rem",fontWeight:600}}>{mode==="in"?"Sign in":"Create account"}</div>
        <button className="x" onClick={onClose}>×</button>
      </div>
      <input className="inp" style={{marginBottom:10}} type="email" placeholder="Email" value={email} onChange={e=>setEmail(e.target.value)}/>
      <input className="inp" style={{marginBottom:14}} type="password" placeholder="Password" value={pw}
        onChange={e=>setPw(e.target.value)} onKeyDown={e=>e.key==="Enter"&&go()}/>
      <button className="gbtn" style={{width:"100%"}} onClick={go} disabled={st&&st.t==="busy"}>
        {mode==="in"?"Sign in":"Sign up"}</button>
      {st&&<div style={{marginTop:10,fontSize:".82rem",color:st.t==="err"?"#f87171":st.t==="ok"?"#4ade80":"rgba(255,255,255,.6)"}}>{st.m}</div>}
      <div style={{marginTop:14,fontSize:".82rem",color:"rgba(255,255,255,.5)",textAlign:"center"}}>
        {mode==="in"?"No account? ":"Have an account? "}
        <a style={{color:"#9666e3",cursor:"pointer"}} onClick={()=>{setMode(mode==="in"?"up":"in");setSt(null);}}>
          {mode==="in"?"Create one":"Sign in"}</a>
      </div>
    </Overlay>);
}

function MyPortfolios({onClose,onLoad}){
  const [items,setItems]=useState(null);
  const reload=async()=>{const {data}=await sb.from("portfolios").select("*").order("updated_at",{ascending:false});setItems(data||[]);};
  useEffect(()=>{reload();},[]);
  async function del(id,e){e.stopPropagation();if(!confirm("Delete this portfolio?"))return;await sb.from("portfolios").delete().eq("id",id);reload();}
  return (
    <Overlay onClose={onClose}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"1rem"}}>
        <div style={{fontSize:"1.15rem",fontWeight:600}}>My portfolios</div>
        <button className="x" onClick={onClose}>×</button>
      </div>
      {items===null && <div style={{color:"rgba(255,255,255,.5)",fontSize:".85rem"}}>Loading…</div>}
      {items&&items.length===0 && <div style={{color:"rgba(255,255,255,.5)",fontSize:".85rem"}}>No saved portfolios yet. Build one and hit Save.</div>}
      <div style={{maxHeight:360,overflowY:"auto",display:"flex",flexDirection:"column",gap:8}}>
        {items&&items.map(p=>(
          <div key={p.id} onClick={()=>onLoad(p)} style={{padding:"11px 13px",borderRadius:10,cursor:"pointer",
            background:"rgba(255,255,255,.03)",border:"1px solid rgba(255,255,255,.07)",display:"flex",justifyContent:"space-between",alignItems:"center"}}
            onMouseEnter={e=>e.currentTarget.style.borderColor="rgba(150,102,227,.4)"}
            onMouseLeave={e=>e.currentTarget.style.borderColor="rgba(255,255,255,.07)"}>
            <div>
              <div style={{fontWeight:500,fontSize:".9rem"}}>{p.name}</div>
              <div style={{fontSize:".74rem",color:"rgba(255,255,255,.45)"}}>
                {p.model} · {p.base_currency} · {(p.holdings||[]).length} holdings · vs {p.benchmark}</div>
            </div>
            <button className="x" onClick={e=>del(p.id,e)} title="Delete">🗑</button>
          </div>))}
      </div>
    </Overlay>);
}

function Field({label,children}){
  return <div><div style={{fontSize:".72rem",color:"rgba(255,255,255,.45)",marginBottom:5}}>{label}</div>{children}</div>;
}

function Results({res,cfg,model,lastReq}){
  const sym=SYM[cfg.base_currency]||"";
  const m=res.metrics||{}, rel=res.relative||{};
  const capRef=useRef(null);
  const [exp,setExp]=useState(null);
  const [chartMode,setChartMode]=useState("rebased");
  const [extraBench,setExtraBench]=useState([]);   // [{ticker, series:[{date,value}]}]
  const [bmAdd,setBmAdd]=useState("");
  const [bmBusy,setBmBusy]=useState(false);
  useEffect(()=>{setExtraBench([]);},[res]);       // reset comparisons on a new compute
  async function addBenchmark(){
    const t=bmAdd.trim();if(!t)return;
    if(t.toLowerCase()===(res.benchmark_ticker||"").toLowerCase()||extraBench.some(x=>x.ticker.toLowerCase()===t.toLowerCase())){setBmAdd("");return;}
    setBmBusy(true);
    try{
      const r=await fetch(API+"/benchmarks",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({tickers:[t],start_date:res.nav[0].date,end_date:res.as_of,base_currency:cfg.base_currency,return_basis:cfg.return_basis})});
      const j=await r.json();const s=j.benchmarks&&j.benchmarks[t];
      if(s&&s.length)setExtraBench(p=>[...p,{ticker:t,series:s}]); else setMsg({t:"err",m:"No data for benchmark "+t});
    }catch(e){setMsg({t:"err",m:"Couldn't add benchmark — is the API up?"});}
    finally{setBmBusy(false);setBmAdd("");}
  }
  const fundRet=res.nav.length?res.nav[res.nav.length-1].value/res.nav[0].value-1:null;
  const bmRet=res.benchmark.length?res.benchmark[res.benchmark.length-1].value/res.benchmark[0].value-1:null;
  const excess=(fundRet!=null&&bmRet!=null)?fundRet-bmRet:null;

  async function exportPDF(){
    if(!lastReq)return;
    setExp("pdf");
    try{
      // Server-side branded report (vector text, not a screenshot).
      const r=await fetch(API+"/export/pdf",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(lastReq)});
      if(!r.ok)throw new Error("server error");
      const blob=await r.blob();const url=URL.createObjectURL(blob);
      const a=document.createElement("a");a.href=url;a.download="portfolio_report.pdf";a.click();URL.revokeObjectURL(url);
    }catch(e){alert("PDF export failed — is the API running?");}
    setExp(null);
  }
  async function exportXLSX(){
    if(!lastReq){return;}
    setExp("xlsx");
    try{
      const r=await fetch(API+"/export",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(lastReq)});
      if(!r.ok)throw new Error("server error");
      const blob=await r.blob();const url=URL.createObjectURL(blob);
      const a=document.createElement("a");a.href=url;a.download="portfolio_nav.xlsx";a.click();URL.revokeObjectURL(url);
    }catch(e){alert("Excel export failed — is the API running?");}
    setExp(null);
  }

  return (
    <div>
      <div style={{display:"flex",gap:10,justifyContent:"flex-end",marginBottom:"1rem",flexWrap:"wrap"}}>
        <button className="gbtn gbtn-ghost" style={{fontSize:".82rem",padding:"9px 16px"}} onClick={exportPDF} disabled={exp}>
          {exp==="pdf"?"Exporting…":"⬇ Export PDF"}</button>
        <button className="gbtn gbtn-ghost" style={{fontSize:".82rem",padding:"9px 16px"}} onClick={exportXLSX} disabled={exp}>
          {exp==="xlsx"?"Exporting…":"⬇ Export Excel"}</button>
      </div>
      <div ref={capRef}>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(150px,1fr))",gap:12,marginBottom:"1.5rem"}}>
        <Kpi k="Latest NAV" v={num(res.nav[res.nav.length-1].value)} />
        <Kpi k="Total return" v={pct(fundRet)} cls={fundRet>=0?"pos":"neg"}/>
        <Kpi k={res.benchmark_ticker+" return"} v={pct(bmRet)} cls={bmRet>=0?"pos":"neg"}/>
        <Kpi k="Excess vs bench" v={pct(excess)} cls={excess>=0?"pos":"neg"}/>
        <Kpi k="Volatility" v={m["Volatility"]!=null?(m["Volatility"]*100).toFixed(1)+"%":"—"}/>
        <Kpi k="Max drawdown" v={m["Max Drawdown"]!=null?(m["Max Drawdown"]*100).toFixed(1)+"%":"—"} cls="neg"/>
      </div>

      {excess!=null && (
        <div style={{fontSize:".92rem",marginBottom:".7rem",color:"rgba(255,255,255,.85)"}}>
          Portfolio is <b style={{color:excess>=0?"#22c55e":"#ef4444"}}>
            {excess>=0?"ahead of":"behind"} {res.benchmark_ticker} by {(Math.abs(excess)*100).toFixed(2)}%
          </b> as of {res.as_of}.
        </div>)}

      <div className="card" style={{padding:"1.5rem",marginBottom:"1.5rem"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"1rem",flexWrap:"wrap",gap:10}}>
          <div className="lbl">Fund vs {res.benchmark_ticker}{extraBench.length?" +"+extraBench.length:""} · {cfg.base_currency}</div>
          <div style={{display:"flex",gap:4,background:"rgba(255,255,255,.04)",padding:4,borderRadius:10}}>
            <button className={"tab"+(chartMode==="rebased"?" on":"")} style={{fontSize:".76rem",padding:"6px 12px"}}
              onClick={()=>setChartMode("rebased")}>Rebased to 100</button>
            <button className={"tab"+(chartMode==="value"?" on":"")} style={{fontSize:".76rem",padding:"6px 12px"}}
              onClick={()=>setChartMode("value")}>True value ({sym.trim()})</button>
          </div>
        </div>
        <div style={{position:"relative",height:320}}><canvas id="navchart"/></div>
        <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap",marginTop:"1rem"}}>
          <span style={{fontSize:".8rem",color:"rgba(255,255,255,.5)"}}>Add benchmarks for comparison:</span>
          <input className="inp" style={{width:170,padding:"6px 10px",fontSize:".82rem"}} placeholder="Yahoo ticker (e.g. QQQ)"
            value={bmAdd} onChange={e=>setBmAdd(e.target.value)} onKeyDown={e=>{if(e.key==="Enter")addBenchmark();}}/>
          <button className="gbtn gbtn-ghost" style={{fontSize:".8rem",padding:"7px 14px"}} onClick={addBenchmark} disabled={bmBusy}>
            {bmBusy?"Adding…":"+ Add"}</button>
          {extraBench.map((x,i)=>(
            <span key={x.ticker} style={{display:"inline-flex",alignItems:"center",gap:6,fontSize:".78rem",
              background:"rgba(255,255,255,.05)",border:"1px solid rgba(255,255,255,.12)",borderRadius:20,padding:"3px 6px 3px 11px"}}>
              <span style={{width:8,height:8,borderRadius:"50%",background:BM_PALETTE[i%BM_PALETTE.length]}}/>{x.ticker}
              <button className="x" onClick={()=>setExtraBench(p=>p.filter(y=>y.ticker!==x.ticker))}>×</button>
            </span>))}
          <span style={{fontSize:".72rem",color:"rgba(255,255,255,.35)"}}>chart only — calculations use {res.benchmark_ticker}</span>
        </div>
      </div>
      <NavChart res={res} mode={chartMode} sym={sym} extra={extraBench}/>

      <div style={{display:"grid",gridTemplateColumns:"1.6fr 1fr",gap:"1.5rem",marginBottom:"1.5rem"}} className="rgrid">
        <div className="card" style={{padding:"1.5rem",overflowX:"auto"}}>
          <div className="lbl" style={{marginBottom:"1rem"}}>Holdings</div>
          <table className="dt"><thead><tr>
            <th>Name</th><th>Ticker</th>{model==="quantity"?<th>Shares</th>:<th>Wt %</th>}
            <th>Price</th><th>Value</th><th>P&amp;L</th><th>Now %</th></tr></thead>
            <tbody>{res.holdings.map((h,i)=>(<tr key={i}>
              <td>{h.name}</td><td style={{color:"rgba(255,255,255,.5)"}}>{h.ticker}</td>
              <td>{model==="quantity"?num(h.shares,0):num(h.weight,1)}</td>
              <td>{h.price!=null?sym+num(h.price):"—"}</td>
              <td>{h.value!=null?sym+num(h.value,0):"—"}</td>
              <td className={((h.pnl_pct!=null?h.pnl_pct:h.contribution_pp)||0)>=0?"pos":"neg"}>{h.pnl_pct!=null?pp(h.pnl_pct):(h.contribution_pp!=null?pp(h.contribution_pp)+" pp":"—")}</td>
              <td>{num(h.weight_now,1)}%</td></tr>))}</tbody></table>
        </div>
        <div className="card" style={{padding:"1.5rem"}}>
          <div className="lbl" style={{marginBottom:"1rem"}}>Currency exposure</div>
          {res.currency_exposure.map(c=>(
            <div key={c.currency} style={{marginBottom:10}}>
              <div style={{display:"flex",justifyContent:"space-between",fontSize:".82rem",marginBottom:4}}>
                <span>{c.currency}</span><span style={{color:"rgba(255,255,255,.55)"}}>{c.pct}%</span></div>
              <div style={{height:7,background:"rgba(255,255,255,.06)",borderRadius:5}}>
                <div style={{height:7,width:c.pct+"%",borderRadius:5,background:"linear-gradient(90deg,#9666e3,#1892f3)"}}/></div>
            </div>))}
          <div className="lbl" style={{margin:"1.4rem 0 .8rem"}}>vs benchmark</div>
          {(res.nav.length-1)<60 && (
            <div style={{fontSize:".72rem",lineHeight:1.4,color:"#e0b34a",background:"rgba(224,179,74,.09)",
              border:"1px solid rgba(224,179,74,.25)",borderRadius:8,padding:"7px 10px",marginBottom:10}}>
              ⚠️ Short history ({res.nav.length-1} trading days). Annualised figures (Alpha, Tracking error, Sharpe)
              extrapolate a brief window to a full year and are unstable — read them as a current pace, not a forecast.</div>)}
          <MetRow label="Alpha (ann)" v={rel["Alpha (ann)"]!=null?(rel["Alpha (ann)"]*100).toFixed(1)+"%":"—"}/>
          <MetRow label="Beta" v={rel["Beta"]!=null?rel["Beta"].toFixed(2):"—"}/>

function concentration(holdings){
  let ws=holdings.map(h=>h.weight_now!=null?h.weight_now/100:null).filter(x=>x!=null);
  if(!ws.length){const tot=holdings.reduce((s,h)=>s+(h.value||0),0);ws=tot>0?holdings.map(h=>(h.value||0)/tot):[];}
  const hhi=ws.reduce((s,w)=>s+w*w,0), sorted=[...ws].sort((x,y)=>y-x);
  const sum=a=>a.reduce((s,w)=>s+w,0);
  return {hhi,eff:hhi>0?1/hhi:0,top5:sum(sorted.slice(0,5)),top10:sum(sorted.slice(0,10)),count:holdings.length};
}
function aggregateBy(holdings,cls,key){
  if(!cls)return [];
  const agg={};
  holdings.forEach(h=>{
    const w=h.weight_now!=null?h.weight_now/100:(h.value||0);
    const g=(cls[h.ticker]&&cls[h.ticker][key])||"Unknown";
    agg[g]=(agg[g]||0)+w;
  });
  const total=Object.values(agg).reduce((a,b)=>a+b,0)||1;
  return Object.entries(agg).map(([k,v])=>({name:k,w:v/total})).sort((a,b)=>b.w-a.w);
}

const RM_WINDOWS=[["1M",21],["3M",63],["6M",126],["1Y",252]];
const RM_METRICS=[["sharpe","Sharpe","ratio"],["vol","Volatility","pct"],["ret","Return (ann.)","pct"],
                  ["beta","Beta","ratio"],["corr","Corr. to benchmark","ratio"],["dd","Max drawdown","pct"]];
function _std(a){const n=a.length;if(n<2)return 0;const m=a.reduce((x,y)=>x+y,0)/n;return Math.sqrt(a.reduce((x,y)=>x+(y-m)*(y-m),0)/(n-1));}
function RollingMetrics({res}){
  const navpts=res.nav||[];
  const hasBench=(res.benchmark||[]).length>0;
  const rf=res.rf_annual!=null?res.rf_annual:0.03;
  const TD=res.trading_days||252;
  const [win,setWin]=useState(21);
  const [metric,setMetric]=useState("sharpe");
  // daily returns + aligned benchmark returns
  const dates=navpts.map(p=>p.date);
  const nv=navpts.map(p=>p.value);
  const rets=[]; for(let i=1;i<nv.length;i++)rets.push(nv[i]/nv[i-1]-1);
  const bmap={}; (res.benchmark||[]).forEach(p=>bmap[p.date]=p.value);
  const bv=dates.map(d=>bmap[d]);
  const bret=[]; for(let i=1;i<bv.length;i++)bret.push(bv[i]!=null&&bv[i-1]!=null?bv[i]/bv[i-1]-1:null);
  const rdates=dates.slice(1);
  const need=(metric==="beta"||metric==="corr");
  useEffect(()=>{
    if(!window.Chart)return;
    const el=document.getElementById("rollchart");if(!el)return;
    if(el._c)el._c.destroy();
    const W=win; if(rets.length<W+1){return;}
    const out=[];
    for(let i=W-1;i<rets.length;i++){
      const w=rets.slice(i-W+1,i+1);
      let val=null;
      if(metric==="vol")val=_std(w)*Math.sqrt(TD)*100;
      else if(metric==="ret")val=(w.reduce((a,b)=>a+b,0)/w.length)*TD*100;
      else if(metric==="sharpe"){const ann=(w.reduce((a,b)=>a+b,0)/w.length)*TD;const vol=_std(w)*Math.sqrt(TD);val=vol>0?(ann-rf)/vol:null;}
      else if(metric==="dd"){let cum=1,pk=1,mdd=0;for(const r of w){cum*=(1+r);if(cum>pk)pk=cum;const d=(cum-pk)/pk;if(d<mdd)mdd=d;}val=mdd*100;}
      else if(metric==="beta"||metric==="corr"){
        const wb=bret.slice(i-W+1,i+1);
        const pairs=[];for(let k=0;k<w.length;k++)if(wb[k]!=null)pairs.push([w[k],wb[k]]);
        if(pairs.length>=3){const mp=pairs.reduce((a,x)=>a+x[0],0)/pairs.length,mb=pairs.reduce((a,x)=>a+x[1],0)/pairs.length;
          let cov=0,vp=0,vb=0;pairs.forEach(([p,b])=>{cov+=(p-mp)*(b-mb);vp+=(p-mp)**2;vb+=(b-mb)**2;});
          if(metric==="beta")val=vb>0?cov/vb:null; else val=(vp>0&&vb>0)?cov/Math.sqrt(vp*vb):null;}
      }
      out.push({x:rdates[i],y:val});
    }
    const pct=RM_METRICS.find(m=>m[0]===metric)[2]==="pct";
    el._c=new Chart(el,{type:"line",data:{labels:out.map(o=>o.x),datasets:[
      {label:RM_METRICS.find(m=>m[0]===metric)[1]+" ("+win+"d)",data:out.map(o=>o.y),
        borderColor:"#9666e3",backgroundColor:"rgba(150,102,227,.08)",borderWidth:2,pointRadius:0,pointHoverRadius:3,tension:.2,fill:metric==="dd"}
    ]},options:{responsive:true,maintainAspectRatio:false,interaction:{mode:"index",intersect:false},
      plugins:{legend:{labels:{color:"#bbb",usePointStyle:true,boxWidth:8,font:{size:10}}},
        tooltip:{callbacks:{label:c=>" "+(c.parsed.y==null?"—":c.parsed.y.toFixed(2)+(pct?"%":""))}}},
      scales:{x:{grid:{display:false},ticks:{color:"#777",font:{size:9},maxTicksLimit:10}},
        y:{grid:{color:"rgba(255,255,255,.05)"},ticks:{color:"#777",font:{size:10},callback:v=>pct?v+"%":v}}}}});
    return()=>{if(el._c)el._c.destroy();};
  },[res,win,metric]);
  if(rets.length<22)return null;   // need at least ~1M of data
  return(
    <div style={{marginBottom:"1.5rem"}}>
      <div className="lbl" style={{margin:"0 0 .4rem"}}>Rolling metrics</div>
      <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:".9rem",alignItems:"center"}}>
        <div style={{display:"flex",gap:4,background:"rgba(255,255,255,.04)",padding:4,borderRadius:10}}>
          {RM_METRICS.map(([k,l])=>{const dis=(k==="beta"||k==="corr")&&!hasBench;return(
            <button key={k} disabled={dis} onClick={()=>setMetric(k)} title={dis?"Needs a benchmark":""}
              className={"tab"+(metric===k?" on":"")} style={{fontSize:".74rem",padding:"5px 10px",opacity:dis?.4:1}}>{l}</button>);})}
        </div>
        <div style={{flex:1}}></div>
        <div style={{display:"flex",gap:4,background:"rgba(255,255,255,.04)",padding:4,borderRadius:10}}>
          {RM_WINDOWS.map(([l,w])=>{const dis=rets.length<w+1;return(
            <button key={w} disabled={dis} onClick={()=>setWin(w)}
              className={"tab"+(win===w?" on":"")} style={{fontSize:".74rem",padding:"5px 10px",opacity:dis?.4:1}}>{l}</button>);})}
        </div>
      </div>
      <div className="card" style={{padding:"1.5rem"}}>
        <div style={{position:"relative",height:300}}><canvas id="rollchart"/></div>
      </div>
    </div>
  );
}

function PairCorrelation({res}){
  const hs=res.holdings_series||{};
  const tickers=Object.keys(hs);
  const [a,setA]=useState(tickers[0]||"");
  const [b,setB]=useState(tickers[1]||tickers[0]||"");
  const [win,setWin]=useState(21);
  // returns per ticker keyed by date
  const retMap=t=>{const s=hs[t]||[];const m={};for(let i=1;i<s.length;i++)m[s[i].date]=s[i].value/s[i-1].value-1;return m;};
  useEffect(()=>{
    if(!window.Chart)return;
    const el=document.getElementById("pairchart");if(!el)return;
    if(el._c)el._c.destroy();
    if(!a||!b||a===b||!hs[a]||!hs[b])return;
    const ra=retMap(a), rb=retMap(b);
    const dates=Object.keys(ra).filter(d=>d in rb).sort();
    if(dates.length<win+1)return;
    const A=dates.map(d=>ra[d]), B=dates.map(d=>rb[d]);
    const out=[];
    for(let i=win-1;i<dates.length;i++){
      const wa=A.slice(i-win+1,i+1), wb=B.slice(i-win+1,i+1);
      const ma=wa.reduce((x,y)=>x+y,0)/wa.length, mb=wb.reduce((x,y)=>x+y,0)/wb.length;
      let cov=0,va=0,vb=0;for(let k=0;k<wa.length;k++){cov+=(wa[k]-ma)*(wb[k]-mb);va+=(wa[k]-ma)**2;vb+=(wb[k]-mb)**2;}
      out.push({x:dates[i],y:(va>0&&vb>0)?cov/Math.sqrt(va*vb):null});
    }
    el._c=new Chart(el,{type:"line",data:{labels:out.map(o=>o.x),datasets:[
      {label:`${a} vs ${b} — ${win}d rolling corr`,data:out.map(o=>o.y),
        borderColor:"#1892f3",backgroundColor:"rgba(24,146,243,.08)",borderWidth:2,pointRadius:0,pointHoverRadius:3,tension:.2}
    ]},options:{responsive:true,maintainAspectRatio:false,interaction:{mode:"index",intersect:false},
      plugins:{legend:{labels:{color:"#bbb",usePointStyle:true,boxWidth:8,font:{size:10}}},
        tooltip:{callbacks:{label:c=>" "+(c.parsed.y==null?"—":c.parsed.y.toFixed(2))}}},
      scales:{x:{grid:{display:false},ticks:{color:"#777",font:{size:9},maxTicksLimit:10}},
        y:{min:-1,max:1,grid:{color:"rgba(255,255,255,.05)"},ticks:{color:"#777",font:{size:10}}}}}});
    return()=>{if(el._c)el._c.destroy();};
  },[res,a,b,win]);
  if(tickers.length<2)return null;
  const selStyle={background:"rgba(255,255,255,.04)",border:"1px solid rgba(255,255,255,.12)",borderRadius:8,color:"#fafafa",padding:"6px 10px",fontSize:".82rem"};
  return(
    <div style={{marginBottom:"1.5rem"}}>
      <div className="lbl" style={{margin:"0 0 .4rem"}}>Rolling correlation — pick two holdings</div>
      <div style={{fontSize:".76rem",color:"rgba(255,255,255,.4)",marginBottom:".9rem"}}>
        How the correlation between two holdings' daily returns moves over time (−1 to +1).
      </div>
      <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:".9rem",alignItems:"center"}}>
        <select value={a} onChange={e=>setA(e.target.value)} style={selStyle}>{tickers.map(t=><option key={t} value={t} style={{background:"#1a1a1a"}}>{t}</option>)}</select>
        <span style={{color:"rgba(255,255,255,.4)"}}>vs</span>
        <select value={b} onChange={e=>setB(e.target.value)} style={selStyle}>{tickers.map(t=><option key={t} value={t} style={{background:"#1a1a1a"}}>{t}</option>)}</select>
        <div style={{flex:1}}></div>
        <div style={{display:"flex",gap:4,background:"rgba(255,255,255,.04)",padding:4,borderRadius:10}}>
          {RM_WINDOWS.map(([l,w])=>(
            <button key={w} onClick={()=>setWin(w)} className={"tab"+(win===w?" on":"")} style={{fontSize:".74rem",padding:"5px 10px"}}>{l}</button>))}
        </div>
      </div>
      {a===b
        ? <div className="card" style={{padding:"1.5rem",color:"rgba(255,255,255,.4)",fontSize:".85rem"}}>Pick two different holdings to compare.</div>
        : <div className="card" style={{padding:"1.5rem"}}><div style={{position:"relative",height:280}}><canvas id="pairchart"/></div></div>}
    </div>
  );
}

function StockPerformance({res}){
  const hs=res.holdings_series||{};
  const tickers=Object.keys(hs);
  useEffect(()=>{
    if(!window.Chart)return;
    const el=document.getElementById("stockchart");if(!el)return;
    if(el._c)el._c.destroy();
    if(!tickers.length)return;
    const pal=["#9666e3","#1892f3","#22c55e","#f59e0b","#ef4444","#06b6d4","#8b5cf6","#ec4899","#10b981","#f97316","#3b82f6","#a78bfa","#eab308","#14b8a6","#f472b6","#60a5fa"];
    // union of dates (use the longest series as the axis)
    let labels=[];tickers.forEach(t=>{if(hs[t].length>labels.length)labels=hs[t].map(p=>p.date);});
    const ds=tickers.map((t,i)=>{const m={};hs[t].forEach(p=>m[p.date]=p.value);
      return {label:t,data:labels.map(d=>m[d]!=null?m[d]:null),borderColor:pal[i%pal.length],
        borderWidth:1.5,pointRadius:0,pointHoverRadius:3,tension:.2,spanGaps:true};});
    el._c=new Chart(el,{type:"line",data:{labels,datasets:ds},
      options:{responsive:true,maintainAspectRatio:false,interaction:{mode:"index",intersect:false},
        plugins:{legend:{labels:{color:"#bbb",usePointStyle:true,boxWidth:8,font:{size:10}}},
          tooltip:{mode:"index",intersect:false,callbacks:{label:c=>" "+c.dataset.label+": "+Number(c.parsed.y).toFixed(1)}}},
        scales:{x:{grid:{display:false},ticks:{color:"#777",font:{size:9},maxTicksLimit:10}},
          y:{grid:{color:"rgba(255,255,255,.05)"},ticks:{color:"#777",font:{size:10}}}}}});
    return()=>{if(el._c)el._c.destroy();};
  },[res]);
  if(!tickers.length)return null;
  return(
    <div style={{marginBottom:"1.5rem"}}>
      <div className="lbl" style={{margin:"0 0 .4rem"}}>Individual stock performance</div>
      <div style={{fontSize:".76rem",color:"rgba(255,255,255,.4)",marginBottom:"1rem"}}>
        Each holding's price over the period, rebased to 100 at the start so you can compare relative performance.
      </div>
      <div className="card" style={{padding:"1.5rem"}}>
        <div style={{position:"relative",height:320}}><canvas id="stockchart"/></div>
      </div>
    </div>
  );
}
function RebalanceActivity({res,sym}){
  const a=res.rebalance_activity;
  const series=(a&&a.series)||[];
  const daily=a&&a.mode==="daily";
  useEffect(()=>{
    if(!window.Chart)return;
    const el=document.getElementById("pnlchart");if(!el)return;
    if(el._c)el._c.destroy();
    if(!series.length)return;
    const money=v=>sym+Number(v).toLocaleString(undefined,{maximumFractionDigits:0});
    el._c=new Chart(el,{data:{labels:series.map(p=>p.date),datasets:[
      {type:"bar",label:daily?"Realized P&L (day)":"Realized P&L (rebalance)",
        data:series.map(p=>p.realized),
        backgroundColor:series.map(p=>p.realized>=0?"#22c55e":"#ef4444"),yAxisID:"y"},
      {type:"line",label:"Cumulative realized",data:series.map(p=>p.cum),
        borderColor:"#9666e3",borderWidth:2,pointRadius:0,tension:.2,yAxisID:"y1"}
    ]},options:{responsive:true,maintainAspectRatio:false,
      interaction:{mode:"index",intersect:false},
      plugins:{legend:{labels:{color:"#bbb",usePointStyle:true,boxWidth:8,font:{size:10}}},
        tooltip:{callbacks:{label:c=>" "+c.dataset.label+": "+money(c.parsed.y)}}},
      scales:{x:{grid:{display:false},ticks:{color:"#777",font:{size:9},maxTicksLimit:12}},
        y:{grid:{color:"rgba(255,255,255,.05)"},ticks:{color:"#777",font:{size:10},callback:v=>money(v)}},
        y1:{position:"right",grid:{display:false},ticks:{color:"#9666e3",font:{size:10},callback:v=>money(v)}}}}});
    return()=>{if(el._c)el._c.destroy();};
  },[res]);

  if(!a||((a.events||[]).length<2 && series.length===0))return null;
  const money=v=>(v==null?"—":(v<0?"-":"")+sym+Math.abs(v).toLocaleString(undefined,{maximumFractionDigits:0}));
  const reb=(a.events||[]).filter(e=>!e.initial);
  const totalPnl=(a.total_realized||0)+(a.unrealized||0);
  return(
    <div style={{marginBottom:"1.5rem"}}>
      <div className="lbl" style={{margin:"0 0 .4rem"}}>Rebalance activity · realized P&amp;L</div>
      <div style={{fontSize:".76rem",color:"rgba(255,255,255,.4)",marginBottom:"1rem",maxWidth:660,lineHeight:1.6}}>
        {daily
          ?"Daily-rebalance mode: realized P&L is booked every day as positions are trimmed back to target (average cost, frictionless)."
          :"Drift mode: realized P&L is booked on each schedule date as positions are trimmed or exited (average cost, frictionless)."}
        {" "}A breakdown of returns already in the NAV — not additional to it.
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(150px,1fr))",gap:12,marginBottom:"1.25rem"}}>
        <Kpi k="Realized P&L" v={money(a.total_realized)} cls={(a.total_realized||0)>=0?"pos":"neg"}/>
        <Kpi k="Unrealized (open)" v={money(a.unrealized)} cls={(a.unrealized||0)>=0?"pos":"neg"}/>
        <Kpi k="Total P&L" v={money(totalPnl)} cls={totalPnl>=0?"pos":"neg"}/>
      </div>
      {series.length>0 && (
        <div className="card" style={{padding:"1.5rem",marginBottom:"1.25rem"}}>
          <div className="lbl" style={{marginBottom:".8rem"}}>Realized P&amp;L over time</div>
          <div style={{position:"relative",height:280}}><canvas id="pnlchart"/></div>
        </div>
      )}
      {reb.length>0 && (
      <div className="card" style={{padding:"1.5rem",overflowX:"auto"}}>
        <div className="lbl" style={{marginBottom:"1rem"}}>{daily?"By schedule period":"By rebalance date"}</div>
        <table className="dt"><thead><tr>
          <th>{daily?"Period from":"Rebalance date"}</th><th>Turnover</th><th>Realized P&amp;L</th><th>Booked on (sells)</th>
        </tr></thead>
        <tbody>{reb.map((e,i)=>(
          <tr key={i}>
            <td>{e.date}</td>
            <td>{money(e.turnover)}</td>
            <td className={e.realized_pnl>=0?"pos":"neg"}>{money(e.realized_pnl)}</td>
            <td style={{color:"rgba(255,255,255,.55)",fontSize:".8rem"}}>
              {(e.names||[]).slice(0,4).map(n=>`${n.ticker} ${n.realized_pnl>=0?"+":""}${money(n.realized_pnl)}`).join(", ")||"—"}
            </td>
          </tr>))}</tbody></table>
      </div>)}
    </div>
  );
}
function Kpi({k,v,cls}){return <div className="kpi"><div className="k">{k}</div><div className={"v "+(cls||"")}>{v}</div></div>;}
function MetRow({label,v}){return <div style={{display:"flex",justifyContent:"space-between",fontSize:".84rem",padding:"6px 0",borderBottom:"1px solid rgba(255,255,255,.04)"}}><span style={{color:"rgba(255,255,255,.55)"}}>{label}</span><span style={{fontWeight:500}}>{v}</span></div>;}

const BM_PALETTE=["#22c55e","#f59e0b","#ec4899","#06b6d4","#a78bfa","#f97316","#eab308","#14b8a6"];
function NavChart({res,mode,sym,extra}){
  useEffect(()=>{
    const el=document.getElementById("navchart");if(!el||!window.Chart)return;
    if(el._c)el._c.destroy();
    const isVal=mode==="value";
    const scale=isVal?(res.start_value||100)/100:1;
    const labels=res.nav.map(p=>p.date);
    const bmap={};res.benchmark.forEach(p=>bmap[p.date]=p.value);
    const money=v=>sym+Number(v).toLocaleString(undefined,{maximumFractionDigits:0});
    const fmt=v=>v==null?"—":(isVal?money(v):Number(v).toFixed(2));
    const yTick=v=>isVal?(Math.abs(v)>=1000?sym+(v/1000).toFixed(v>=1e6?1:0)+(v>=1e6?"M":"k"):sym+v):v;
    const extraDs=(extra||[]).map((x,i)=>{const mm={};x.series.forEach(p=>mm[p.date]=p.value);
      return {label:x.ticker,data:labels.map(d=>mm[d]!=null?mm[d]*scale:null),
        borderColor:BM_PALETTE[i%BM_PALETTE.length],borderWidth:1.5,borderDash:[3,3],pointRadius:0,pointHoverRadius:4,tension:.25,spanGaps:true};});
    el._c=new Chart(el,{type:"line",data:{labels,datasets:[
      {label:"Fund",data:res.nav.map(p=>p.value*scale),borderColor:"#9666e3",backgroundColor:"rgba(150,102,227,.08)",borderWidth:2,pointRadius:0,pointHoverRadius:4,tension:.25,fill:true},
      {label:res.benchmark_ticker,data:labels.map(d=>bmap[d]!=null?bmap[d]*scale:null),borderColor:"#1892f3",borderWidth:2,borderDash:[5,4],pointRadius:0,pointHoverRadius:4,tension:.25},
      ...extraDs
    ]},options:{responsive:true,maintainAspectRatio:false,
      interaction:{mode:"index",intersect:false},
      plugins:{legend:{labels:{color:"#bbb",usePointStyle:true,boxWidth:8}},
        tooltip:{mode:"index",intersect:false,backgroundColor:"rgba(24,24,27,.97)",borderColor:"rgba(150,102,227,.4)",borderWidth:1,
          padding:11,cornerRadius:9,titleColor:"#fff",bodyColor:"#ddd",usePointStyle:true,
          callbacks:{label:c=>"  "+c.dataset.label+": "+fmt(c.parsed.y)}}},
      scales:{x:{grid:{display:false},ticks:{color:"#777",maxTicksLimit:8,font:{size:10}}},
        y:{grid:{color:"rgba(255,255,255,.05)"},ticks:{color:"#777",font:{size:10},callback:yTick}}}}});
  },[res,mode,sym,extra]);
  return null;
}
