<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Swerve — Graph (Coming Soon)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Poppins',sans-serif;color:#fafafa;min-height:100vh;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:2rem;
  background:radial-gradient(circle at 20% 30%,rgba(99,102,241,.15),transparent 40%),
             radial-gradient(circle at 80% 70%,rgba(59,130,246,.15),transparent 40%),#000;
}
.brand{font-weight:700;font-size:1.6rem;letter-spacing:-.02em;margin-bottom:2.5rem;
  background:linear-gradient(135deg,#9666e3,#1892f3);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.tag{font-size:.72rem;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:rgba(150,102,227,.9);margin-bottom:1rem}
h1{font-size:clamp(2rem,6vw,3rem);font-weight:800;letter-spacing:-.02em;margin-bottom:1rem}
h1 span{background:linear-gradient(135deg,#9666e3,#1892f3);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
p{color:rgba(255,255,255,.55);max-width:460px;line-height:1.7;margin-bottom:2.25rem}
a.btn{text-decoration:none;color:#fff;font-weight:600;font-size:.9rem;padding:12px 26px;border-radius:12px;
  background:linear-gradient(135deg,#9666e3,#1892f3);transition:transform .15s,box-shadow .2s}
a.btn:hover{transform:translateY(-1px);box-shadow:0 6px 24px rgba(150,102,227,.45)}
</style>
</head>
<body>
  <div class="brand">swerve</div>
  <div class="tag">Swerve Graph</div>
  <h1>Coming <span>Soon</span></h1>
  <p>The interactive sector &amp; company relationship graph is being finalised. It'll be live here shortly.</p>
  <a class="btn" href="/">Back to Home</a>
</body>
</html>
