<style>
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:'Poppins',sans-serif;
  background: radial-gradient(circle at 20% 30%, rgba(99,102,241,0.15), transparent 40%),
              radial-gradient(circle at 80% 70%, rgba(59,130,246,0.15), transparent 40%),
              #000;
  overflow-x:hidden;
  max-width:100vw;
  -webkit-font-smoothing:antialiased;
}
input,select,textarea,button{font-family:'Poppins',sans-serif}
::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-track{background:#000}
::-webkit-scrollbar-thumb{background:#27272a}

/* Zinc-900 ring card — core bento primitive */
.card{
  background:rgba(24,24,27,.95);
  border:1px solid rgba(255,255,255,.08);
  border-radius:16px;
  overflow:hidden;
}
.card-sharp{
  background:rgba(24,24,27,.95);
  border:1px solid rgba(255,255,255,.08);
  border-radius:8px;
  overflow:hidden;
}
button {
  transition: all 0.2s ease;
}

button:hover {
  box-shadow: 0 4px 20px rgba(0,0,0,0.3);
}


/* Gradient text */
.gt{
  background:linear-gradient(135deg,#fff 0%,rgba(255,255,255,.55) 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.gt-purple{
  background:linear-gradient(135deg,#9666e3,#1892f3);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}

/* SVG grid pattern */
.grid-bg{
  background-image:
    linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);
  background-size:40px 40px;
}

/* Dot grid */
.dot-bg{
  background-image:radial-gradient(circle,rgba(255,255,255,.12) 1px,transparent 1px);
  background-size:22px 22px;
}

/* Glow button */
@keyframes glowPulse{
  0%,100%{box-shadow:0 0 20px rgba(150,102,227,.5),0 0 40px rgba(24,146,243,.25)}
  50%{box-shadow:0 0 32px rgba(150,102,227,.8),0 0 60px rgba(24,146,243,.45),0 0 80px rgba(150,102,227,.3)}
}
@keyframes glowRotate{
  0%{transform:rotate(0deg) scale(1.4)}
  100%{transform:rotate(360deg) scale(1.4)}
}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
@keyframes scanDown{
  0%{transform:translateY(-100%);opacity:.8}
  100%{transform:translateY(400%);opacity:0}
}
@keyframes nodeFlash{
  0%,90%,100%{opacity:.3;transform:scale(1)}
  92%,98%{opacity:1;transform:scale(1.35)}
}
@keyframes tickerX{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes spinSlow{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes shimmer{
  0%{background-position:-200% 0}
  100%{background-position:200% 0}
}
@keyframes barAnim{from{height:0}to{height:var(--bh)}}
@keyframes dashDraw{from{stroke-dashoffset:300}to{stroke-dashoffset:0}}

.aSpin{animation:spinSlow 8s linear infinite}
.aPulse{animation:glowPulse 2.4s ease-in-out infinite}
.aTick{animation:tickerX 40s linear infinite}
.aBlink{animation:blink 1.1s step-end infinite}
.aFloat{animation:float 3.5s ease-in-out infinite}
.drawPath{stroke-dasharray:300;animation:dashDraw 1.8s ease forwards .5s both}

/* Overline label */
.lbl{
  font-size:1rem;font-weight:600;letter-spacing:.2em;
  text-transform:uppercase;color:rgba(150,102,227,.9);
}

/* Inputs */
.inp{
  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.1);
  border-radius:10px;color:#fafafa;width:100%;
  padding:11px 14px;font-size:.875rem;outline:none;
  transition:border-color .2s;
}
.inp:focus{border-color:rgba(150,102,227,.5)}
.inp::placeholder{color:rgba(255,255,255,.25)}

/* Drop zone */
.drop{
  border:1px dashed rgba(150,102,227,.3);border-radius:10px;
  padding:1.5rem;text-align:center;cursor:pointer;
  transition:border-color .2s,background .2s;
}
.drop:hover{border-color:rgba(150,102,227,.6);background:rgba(150,102,227,.04)}

/* Data table */
.dt{width:100%;border-collapse:collapse}
.dt th{
  font-size:.62rem;font-weight:600;letter-spacing:.14em;
  text-transform:uppercase;color:rgba(255,255,255,.4);
  padding:11px 18px;border-bottom:1px solid rgba(255,255,255,.06);
  text-align:left;background:rgba(0,0,0,.4);white-space:nowrap;cursor:pointer;
  user-select:none;
}
.dt td{
  padding:14px 18px;border-bottom:1px solid rgba(255,255,255,.04);
  font-size:.84rem;vertical-align:middle;
}
.dt tbody tr:hover{background:rgba(255,255,255,.02)}

/* Responsive */
@media(max-width:768px){
  .hidM{display:none!important}
  .shoM{display:flex!important}
  .mobCol{flex-direction:column!important}
}
@media(min-width:769px){.shoM{display:none!important}}

/* ── Global font size boosts for card content ── */
.lbl{font-size:.8rem!important}
.dt th{font-size:.7rem!important}
.dt td{font-size:.93rem!important}
.inp{font-size:.95rem!important}
/* Boost paragraph text in cards */
.card p{font-size:.925rem;line-height:1.75}
/* Slightly boost table text */
.dt td{font-size:.92rem!important}

/* ── Blog ── */
.bcard{transition:transform .25s ease,border-color .25s ease}
.bcard:hover{transform:translateY(-4px);border-color:rgba(150,102,227,.4)}
.tagpill{
  font-size:.66rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  padding:3px 9px;border-radius:999px;background:rgba(150,102,227,.12);
  border:1px solid rgba(150,102,227,.25);color:rgba(196,168,242,.95);
}
.md{color:rgba(255,255,255,.82);font-size:1.04rem;line-height:1.85;font-weight:300}
.md h1{font-size:1.9rem;font-weight:800;letter-spacing:-.03em;margin:0 0 1rem;color:#fff}
.md h2{font-size:1.5rem;font-weight:700;letter-spacing:-.03em;margin:2.4rem 0 .9rem;color:#fff;scroll-margin-top:90px}
.md h3{font-size:1.18rem;font-weight:600;margin:1.8rem 0 .6rem;color:rgba(255,255,255,.95)}
.md p{margin:0 0 1.15rem}
.md ul,.md ol{margin:0 0 1.2rem 1.3rem}
.md li{margin:.4rem 0}
.md strong{color:#fff;font-weight:600}
.md a{color:#1892f3;text-decoration:none;border-bottom:1px solid rgba(24,146,243,.4)}
.md a:hover{border-bottom-color:#1892f3}
.md blockquote{border-left:3px solid #9666e3;margin:1.4rem 0;padding:.3rem 0 .3rem 1.2rem;
  color:rgba(255,255,255,.6);font-style:italic}
.md code{background:rgba(255,255,255,.07);padding:.12em .4em;border-radius:5px;
  font-size:.9em;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.md pre{background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.08);border-radius:10px;
  padding:1rem 1.2rem;overflow:auto;margin:0 0 1.3rem}
.md pre code{background:none;padding:0}
.md img{max-width:100%;border-radius:12px;margin:1.2rem 0}
.md hr{border:none;border-top:1px solid rgba(255,255,255,.1);margin:2rem 0}
.md table{width:100%;border-collapse:collapse;margin:0 0 1.3rem;font-size:.92rem}
.md th,.md td{border:1px solid rgba(255,255,255,.1);padding:8px 12px;text-align:left}
.md th{background:rgba(255,255,255,.04);font-weight:600;color:#fff}

/* ══ Mobile overrides ══ */
@media(max-width:768px){
  /* Reduce hero padding */
  section{
    padding-left:1rem!important;
    padding-right:1rem!important;
  }

  /* Bento 12-col grid: go single column */
  div[style*="repeat(12,1fr)"]{
    grid-template-columns:1fr!important;
  }
  /* Override gridColumn spans in bento children */
  div[style*="gridColumn"]{
    grid-column:1!important;
  }

  /* 2-col grids -> single col */
  div[style*="gridTemplateColumns:\"1fr 1fr\""]{
    grid-template-columns:1fr!important;
  }
  div[style*='gridTemplateColumns:"1fr 1fr"']{
    grid-template-columns:1fr!important;
  }

  /* 3-col testimonials -> single col */
  div[style*='repeat(3,1fr)']{
    grid-template-columns:1fr!important;
  }

  /* Contact layout: sidebar + form */
  div[style*='"320px 1fr"']{
    grid-template-columns:1fr!important;
  }

  /* Contact form: name + email row */
  form div[style*='"1fr 1fr"']{
    grid-template-columns:1fr!important;
  }

  /* Bento cards: limit height on mobile */
  .card[style*="height:280"], .card[style*="height:420"]{
    height:auto!important;
    min-height:220px;
  }

  /* Prevent cards & SVGs from overflowing horizontally */
  .card{
    overflow:hidden!important;
    max-width:100%!important;
    width:100%!important;
    box-sizing:border-box!important;
  }
  .card svg{
    overflow:hidden!important;
    max-width:100%!important;
  }

  /* Bento grid children must not exceed viewport */
  div[style*="repeat(12,1fr)"] > div,
  div[style*="repeat(12,1fr)"] > div > div{
    max-width:100%!important;
    min-width:0!important;
  }

  /* Founders/blog auto-fit grids */
  div[style*="minmax(300px"]{
    grid-template-columns:1fr!important;
  }
  div[style*="minmax(320px"]{
    grid-template-columns:1fr!important;
  }
  div[style*="minmax(160px"]{
    grid-template-columns:1fr 1fr!important;
  }

  /* Research table wrap */
  div[style*="overflow:\"auto\""]{
    overflow-x:auto!important;
  }

  /* Stat row: 2 per row */
  div[style*='"gap:\"3rem\"']{
    gap:1.5rem!important;
  }

  /* CTA buttons row */
  div[style*='"justifyContent:\"center\"']{
    flex-direction:column!important;
    align-items:stretch!important;
  }
  div[style*='"justifyContent:\"center\"'] button,
  div[style*='"justifyContent:\"center\"'] > *{
    width:100%!important;
    text-align:center!important;
  }

  /* Hero H1 */
  h1{font-size:clamp(1.9rem,8vw,3rem)!important;line-height:1.1!important}

  /* Nav padding */
  header > div{padding:.75rem 1rem!important}
}

.gbtn{position:relative;border:none;border-radius:12px;cursor:pointer;color:#fff;font-family:'Poppins',sans-serif;font-weight:600;background:linear-gradient(135deg,#9666e3,#1892f3);padding:11px 22px;font-size:.9rem;transition:transform .15s,box-shadow .2s}

/* ════════════════════════════════════════
   APPLE-DESIGN PASS — additive only, nothing
   above this point was touched.
════════════════════════════════════════*/

/* 1. Response — instant feedback on press, not just on release/hover.
   Applies to every <button> in the app in one shot. */
button{transition:transform .12s cubic-bezier(.4,0,.2,1),background .2s,color .2s,border-color .2s,box-shadow .2s}
button:active{transform:scale(.97)}
.press-surface{transition:transform .12s cubic-bezier(.4,0,.2,1)}
.press-surface:active{transform:scale(.985)}

/* 2. Modals materialize instead of popping in. */
@keyframes overlayFadeIn{from{opacity:0}to{opacity:1}}
@keyframes modalIn{from{opacity:0;transform:scale(.94) translateY(8px)}to{opacity:1;transform:scale(1) translateY(0)}}

/* 3. Expand/collapse reveals via grid-rows (no JS height measurement needed). */
.reveal{display:grid;grid-template-rows:0fr;transition:grid-template-rows .25s cubic-bezier(.4,0,.2,1)}
.reveal.open{grid-template-rows:1fr}
.reveal>div{overflow:hidden}

/* 5. Respect the OS-level motion/transparency/contrast preferences. */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
}
@media (prefers-reduced-transparency: reduce){
  header,.card,.card-sharp{backdrop-filter:none!important}
}

/* 6. Material weight — a heavier, elevated surface for structural/summary
   panels (balance tiles, KPI headers), vs. the flatter list rows beneath. */
.card-elevated{
  background:rgba(28,28,32,.85);
  border:1px solid rgba(255,255,255,.1);
  border-radius:16px;
  backdrop-filter:blur(20px) saturate(140%);
  box-shadow:0 8px 32px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.06);
}

/* 4. CSS-driven hover states (replacing onMouseEnter/onMouseLeave DOM
   mutation) for the hovers that don't depend on other component state. */
.hov-fade-white{transition:color .18s}
.hov-fade-white:hover{color:#fff}
.hov-ghost-btn{transition:background .2s,color .2s}
.hov-ghost-btn:hover{background:rgba(255,255,255,.09);color:#fff}
.hov-linkedin-chip{transition:background .15s,color .15s}
.hov-linkedin-chip:hover{background:rgba(255,255,255,.1);color:#fff}
.hov-email-chip{transition:background .15s}
.hov-email-chip:hover{background:rgba(150,102,227,.3)}
.hov-card-lift{transition:transform .22s ease,border-color .22s ease,box-shadow .22s ease}
.hov-card-lift:hover{transform:translateY(-4px);border-color:rgba(150,102,227,.4);box-shadow:0 16px 48px rgba(150,102,227,.14)}
.hov-scale-btn{transition:opacity .15s,transform .15s}
.hov-scale-btn:hover{opacity:.88;transform:scale(1.04)}
.hov-blue{transition:color .2s}
.hov-blue:hover{color:#1892f3}
.hov-border-purple{transition:border-color .2s}
.hov-border-purple:hover{border-color:rgba(150,102,227,.4)}
</style>

/* ── FadeUp (scroll reveal) ── */
function FadeUp({children,delay=0,className="",style={}}){
  const ref=useRef(null);
  useEffect(()=>{
    const el=ref.current;if(!el)return;
    el.style.opacity="0";
    el.style.transform="translateY(22px)";
    el.style.transition=`opacity .65s cubic-bezier(.22,1,.36,1) ${delay}s,`
      +`transform .65s cubic-bezier(.22,1,.36,1) ${delay}s`;
    const obs=new IntersectionObserver(([e])=>{
      if(e.isIntersecting){el.style.opacity="1";el.style.transform="translateY(0)";obs.disconnect();}
    },{threshold:.06,rootMargin:"0px 0px -40px 0px"});
    obs.observe(el);
    return()=>obs.disconnect();
  },[delay]);
  return <div ref={ref} className={className} style={style}>{children}</div>;
}

/* ════════════════════════════════════════
   ECONOMIC CALENDAR PAGE
════════════════════════════════════════*/

const IMPACT_COLORS={High:"#ef4444",Medium:"#f59e0b",Low:"#22c55e"};
const MOCK_CAL=(()=>{const t=new Date().toISOString().slice(0,10);return[
  {id:1,slug:"repo-rate",indicator_name:"RBI Monetary Policy Committee",category:"Monetary Policy & Interest Rates",event_date:t,time_start:"10:00:00",impact:"High",previous_value:"5.25%",actual_value:null,expected_value:"5.25%",source:"TE"},
  {id:2,slug:"cpi",indicator_name:"Consumer Price Index (CPI) Inflation",category:"Inflation",event_date:t,time_start:"17:30:00",impact:"High",previous_value:"3.1%",actual_value:null,expected_value:"3.2%",source:"CMIE"},
];})();

const fmtTime=t=>{
  if(!t)return null;
  const[h,m]=t.split(":").map(Number);
  const ap=h>=12?"PM":"AM";
  const h12=h%12===0?12:h%12;
  return `${h12}:${String(m).padStart(2,"0")} ${ap}`;
};
const isoDate=d=>{
  const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,"0"),dd=String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${dd}`;
};

function Calendar(){
  const[events,setEvents]=useState([]);
  const[loading,setLoading]=useState(true);
  const[ferr,setFerr]=useState(null);
  const[cursor,setCursor]=useState(()=>{const d=new Date();d.setDate(1);return d;});
  const[impactFilter,setImpactFilter]=useState(new Set(["High","Medium","Low"]));
  const today=useMemo(()=>new Date(),[]);
  const[selDate,setSelDate]=useState(()=>isoDate(today));

  useEffect(()=>{
    (async()=>{
      setLoading(true);
      try{
        const{data,error}=await sb.from("economic_calendar_events").select("*")
          .order("event_date",{ascending:true}).order("time_start",{ascending:true});
        if(error)throw error;
        setEvents(data&&data.length?data:MOCK_CAL);
        if(!data||!data.length)setFerr("Demo data — live database unavailable.");
      }catch(e){setEvents(MOCK_CAL);setFerr("Demo data — live database unavailable.");}
      finally{setLoading(false);}
    })();
  },[]);

  const byDate=useMemo(()=>{
    const m={};
    events.filter(e=>impactFilter.has(e.impact)).forEach(e=>{
      (m[e.event_date]=m[e.event_date]||[]).push(e);
    });
    return m;
  },[events,impactFilter]);

  const monthLabel=cursor.toLocaleDateString("en-US",{month:"long",year:"numeric"});
  const changeMonth=delta=>setCursor(c=>{const d=new Date(c);d.setMonth(d.getMonth()+delta);return d;});

  const grid=useMemo(()=>{
    const year=cursor.getFullYear(),month=cursor.getMonth();
    const startPad=new Date(year,month,1).getDay();
    const daysInMonth=new Date(year,month+1,0).getDate();
    const cells=[];
    for(let i=0;i<startPad;i++)cells.push(new Date(year,month,1-(startPad-i)));
    for(let d=1;d<=daysInMonth;d++)cells.push(new Date(year,month,d));
    while(cells.length%7!==0)cells.push(new Date(year,month,daysInMonth+1+(cells.length-startPad-daysInMonth)));
    return cells;
  },[cursor]);

  const toggleImpact=lvl=>setImpactFilter(s=>{
    const n=new Set(s);
    if(n.has(lvl)&&n.size>1)n.delete(lvl);else n.add(lvl);
    return n;
  });

  const todayISO=isoDate(today);
  const selEvents=byDate[selDate]||[];
  const DOW=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

  return(
    <div style={{minHeight:"100vh",paddingTop:64}}>
      <div style={{borderBottom:"1px solid rgba(255,255,255,.06)",padding:"3rem 2rem 2rem"}}>
        <div style={{maxWidth:1280,margin:"0 auto"}}>
          <FadeUp>
            <h1 style={{fontSize:"clamp(1.8rem,4vw,2.4rem)",fontWeight:700,letterSpacing:"-.02em",color:"#fff"}}>
              India <span className="gt-purple">Economic Calendar</span>
            </h1>
            <p style={{marginTop:10,color:"rgba(255,255,255,.55)",fontSize:".95rem",maxWidth:640}}>
              Key India data releases, RBI policy decisions, and growth indicators — actuals, forecasts, and previous values in one place.
            </p>
          </FadeUp>
        </div>
      </div>

      <div style={{maxWidth:1280,margin:"0 auto",padding:"2rem"}}>
        {ferr&&<div style={{marginBottom:16,fontSize:".8rem",color:"rgba(255,255,255,.4)"}}>{ferr}</div>}

        <div style={{display:"flex",flexWrap:"wrap",gap:16,alignItems:"center",justifyContent:"space-between",marginBottom:20}}>
          <div style={{display:"flex",alignItems:"center",gap:14}}>
            <button onClick={()=>changeMonth(-1)} style={{background:"rgba(255,255,255,.05)",border:"1px solid rgba(255,255,255,.1)",
              borderRadius:8,width:32,height:32,color:"#fff",cursor:"pointer"}}>‹</button>
            <div style={{fontWeight:600,fontSize:"1.05rem",minWidth:150,textAlign:"center"}}>{monthLabel}</div>
            <button onClick={()=>changeMonth(1)} style={{background:"rgba(255,255,255,.05)",border:"1px solid rgba(255,255,255,.1)",
              borderRadius:8,width:32,height:32,color:"#fff",cursor:"pointer"}}>›</button>
          </div>
          <div style={{display:"flex",gap:8}}>
            {["High","Medium","Low"].map(lvl=>(
              <button key={lvl} onClick={()=>toggleImpact(lvl)} style={{
                display:"flex",alignItems:"center",gap:6,padding:"6px 12px",borderRadius:20,cursor:"pointer",
                fontSize:".76rem",fontWeight:500,border:`1px solid ${impactFilter.has(lvl)?IMPACT_COLORS[lvl]+"55":"rgba(255,255,255,.1)"}`,
                background:impactFilter.has(lvl)?IMPACT_COLORS[lvl]+"18":"transparent",
                color:impactFilter.has(lvl)?"#fff":"rgba(255,255,255,.4)"}}>
                <span style={{width:8,height:8,borderRadius:"50%",background:IMPACT_COLORS[lvl]}}/>{lvl}
              </button>
            ))}
          </div>
        </div>

        <div className="card-elevated" style={{padding:"1.25rem"}}>
          <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:6,marginBottom:8}}>
            {DOW.map(d=>(
              <div key={d} style={{textAlign:"center",fontSize:".7rem",fontWeight:600,letterSpacing:".05em",
                color:"rgba(255,255,255,.4)",padding:"4px 0"}}>{d.toUpperCase()}</div>
            ))}
          </div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:6}}>
            {grid.map((d,i)=>{
              const iso=isoDate(d);
              const inMonth=d.getMonth()===cursor.getMonth();
              const dayEvents=byDate[iso]||[];
              const isToday=iso===todayISO;
              const isSel=iso===selDate;
              return(
                <button key={i} onClick={()=>setSelDate(iso)} style={{
                  minHeight:74,textAlign:"left",borderRadius:10,padding:"6px 8px",cursor:"pointer",
                  background:isSel?"rgba(150,102,227,.14)":"rgba(255,255,255,.02)",
                  border:isToday?"1px solid rgba(150,102,227,.6)":"1px solid rgba(255,255,255,.05)",
                  opacity:inMonth?1:.35}}>
                  <div style={{fontSize:".78rem",fontWeight:isToday?700:500,color:isToday?P:"#fff"}}>{d.getDate()}</div>
                  <div style={{display:"flex",flexWrap:"wrap",gap:3,marginTop:6}}>
                    {dayEvents.slice(0,4).map(e=>(
                      <span key={e.id} title={e.indicator_name} style={{width:6,height:6,borderRadius:"50%",
                        background:IMPACT_COLORS[e.impact]||"rgba(255,255,255,.3)"}}/>
                    ))}
                  </div>
                </button>
              );
            })}
          </div>
        </div>

        <div style={{marginTop:28}}>
          <h3 style={{fontSize:"1.1rem",fontWeight:600,marginBottom:14,color:"#fff"}}>
            {selDate===todayISO?"Today's Events":new Date(selDate+"T00:00:00").toLocaleDateString("en-US",{weekday:"long",day:"numeric",month:"long",year:"numeric"})}
          </h3>
          {loading?(
            <div style={{color:"rgba(255,255,255,.4)",fontSize:".85rem"}}>Loading…</div>
          ):selEvents.length===0?(
            <div className="card" style={{padding:"1.5rem",color:"rgba(255,255,255,.4)",fontSize:".85rem"}}>No tracked releases on this day.</div>
          ):(
            <div style={{display:"flex",flexDirection:"column",gap:10}}>
              {selEvents.map(e=>(
                <div key={e.id} className="card-sharp" style={{padding:"14px 18px",display:"flex",alignItems:"center",gap:16,flexWrap:"wrap"}}>
                  <div style={{width:74,fontSize:".78rem",color:"rgba(255,255,255,.5)",fontWeight:500}}>{fmtTime(e.time_start)||"—"}</div>
                  <span style={{width:8,height:8,borderRadius:"50%",background:IMPACT_COLORS[e.impact]||"#666",flexShrink:0}}/>
                  <div style={{flex:1,minWidth:180}}>
                    <div style={{fontWeight:600,fontSize:".92rem",color:"#fff"}}>{e.indicator_name}</div>
                    {e.category&&<div style={{fontSize:".72rem",color:"rgba(255,255,255,.4)",marginTop:2}}>{e.category}</div>}
                  </div>
                  <div style={{display:"flex",gap:22,fontSize:".8rem"}}>
                    <div><div style={{color:"rgba(255,255,255,.4)",fontSize:".68rem"}}>Previous</div><div style={{color:"#fff"}}>{e.previous_value||"—"}</div></div>
                    <div><div style={{color:"rgba(255,255,255,.4)",fontSize:".68rem"}}>Actual</div><div style={{fontWeight:600,color:e.actual_value?"#fff":"rgba(255,255,255,.3)"}}>{e.actual_value||"—"}</div></div>
                  </div>
                </div>
              ))}
            </div>
          )}
        </div>

        <div style={{marginTop:28,fontSize:".72rem",color:"rgba(255,255,255,.3)",lineHeight:1.6}}>
          Disclaimer: dates are for general informational purposes and may change without notice. Verify against official sources before relying on them.
        </div>
      </div>
    </div>
  );
}

/* ── Footer ── */
function Foot(){
  const links=[["Research Hub","research"],["Contact","contact"]];
  return(
    <footer style={{borderTop:"1px solid rgba(255,255,255,.06)",padding:"2.5rem 2rem 1.75rem",background:"#000"}}>
      <div style={{maxWidth:1280,margin:"0 auto",textAlign:"center"}}>
        <div style={{display:"flex",gap:22,justifyContent:"center",marginBottom:"1rem",flexWrap:"wrap"}}>
          {links.map(([l,p])=>(
            <a key={p} href={ROUTES[p]||"/"} className="hov-fade-white" style={{textDecoration:"none",color:"rgba(255,255,255,.4)",fontSize:".78rem"}}>{l}</a>
          ))}
        </div>
        <p style={{color:"rgba(255,255,255,.18)",fontSize:".68rem"}}>© {new Date().getFullYear()} Swerve Financial Research. All rights reserved.</p>
      </div>
    </footer>
  );
}

function App(){
  return(<><Nav/><main><Calendar/></main><Foot/></>);
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
